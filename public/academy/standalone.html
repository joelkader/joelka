<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watt Street — Energy & Compute Analyst Academy</title>
<meta name="description" content="A training game for energy, power, data center and compute-infrastructure finance.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
/* Watt Street — Energy & Compute Analyst Academy */

:root {
  --bg: #0b1020;
  --bg2: #101731;
  --card: #141d3d;
  --card2: #1a2549;
  --line: #27335f;
  --ink: #e8ecf8;
  --ink-dim: #9aa7cc;
  --ink-faint: #66729b;
  --accent: #ffb454;
  --accent2: #4cc38a;
  --bad: #f26d78;
  --info: #6cb2f5;
  --gold: #ffd166;
  --radius: 12px;
  --mono: "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
}
/* Light tokens: applied by OS preference when no explicit choice, and by
   explicit data-theme="light" (from in-app Settings or an embedding viewer's
   toggle). data-theme="dark" always wins back the dark tokens. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6fb;
    --bg2: #ffffff;
    --card: #ffffff;
    --card2: #eef1f9;
    --line: #d8ddec;
    --ink: #1a2138;
    --ink-dim: #4d5878;
    --ink-faint: #8b94b3;
    --accent: #c76a00;
    --accent2: #177a4c;
    --bad: #c22f3d;
    --info: #1f6fc4;
    --gold: #a97b00;
  }
}
[data-theme="light"] {
  --bg: #f4f6fb;
  --bg2: #ffffff;
  --card: #ffffff;
  --card2: #eef1f9;
  --line: #d8ddec;
  --ink: #1a2138;
  --ink-dim: #4d5878;
  --ink-faint: #8b94b3;
  --accent: #c76a00;
  --accent2: #177a4c;
  --bad: #c22f3d;
  --info: #1f6fc4;
  --gold: #a97b00;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code { background: var(--card2); padding: 1px 5px; border-radius: 5px; font-size: 0.9em; }

/* ---------- layout ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .brand { font-weight: 800; letter-spacing: 0.4px; cursor: pointer; white-space: nowrap; }
.topbar .brand span { color: var(--accent); }
.topbar .stats { display: flex; gap: 14px; margin-left: auto; align-items: center; font-size: 13px; color: var(--ink-dim); flex-wrap: wrap; }
.topbar .pill {
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 12px; white-space: nowrap;
}
.topbar .pill b { color: var(--ink); }
.wrap { max-width: 1020px; margin: 0 auto; padding: 22px 18px 90px; }

.crumbs { font-size: 13px; color: var(--ink-faint); margin-bottom: 14px; }
.crumbs a { color: var(--ink-dim); }

h1 { font-size: 26px; margin: 8px 0 6px; }
h2 { font-size: 20px; margin: 26px 0 10px; }
h3 { font-size: 16px; margin: 20px 0 8px; color: var(--accent); }
p.lead { color: var(--ink-dim); margin-top: 0; }

/* ---------- cards & grids ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px;
}
.card.clickable { cursor: pointer; transition: transform 0.08s ease, border-color 0.12s; }
.card.clickable:hover { transform: translateY(-2px); border-color: var(--accent); }
.card h3 { margin: 0 0 4px; color: var(--ink); font-size: 16px; }
.card .icon { font-size: 22px; margin-right: 8px; }
.card .desc { color: var(--ink-dim); font-size: 13.5px; margin: 4px 0 10px; }
.card .meta { font-size: 12px; color: var(--ink-faint); display: flex; gap: 12px; flex-wrap: wrap; }

.progressbar { height: 7px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progressbar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; }

.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--ink-dim); text-transform: uppercase; }
.badge.pass { color: var(--accent2); border-color: var(--accent2); }
.badge.gold { color: var(--gold); border-color: var(--gold); }

/* ---------- buttons ---------- */
.btn {
  display: inline-block; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card2); color: var(--ink); padding: 9px 18px;
  font-size: 14.5px; font-weight: 600; cursor: pointer; transition: border-color 0.12s, background 0.12s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #14100a; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* ---------- lesson prose ---------- */
.prose { font-size: 15.5px; }
.prose h3 { margin-top: 26px; }
.prose table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px; }
.prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.prose th { background: var(--card2); font-weight: 700; }
.prose td.num, .prose th.num { text-align: right; font-family: var(--mono); }
.prose ul, .prose ol { padding-left: 22px; }
.prose li { margin: 4px 0; }
.tablewrap { overflow-x: auto; }
.keybox {
  border: 1px solid var(--line); border-left: 4px solid var(--accent);
  background: var(--card2); border-radius: 8px; padding: 10px 14px; margin: 14px 0;
  font-size: 14.5px;
}
.keybox b:first-child { color: var(--accent); }
.formula {
  font-family: var(--mono); background: var(--card2); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 14px; overflow-x: auto;
}
.workedex {
  border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; margin: 12px 0;
  font-size: 14px; background: color-mix(in srgb, var(--card2) 55%, transparent);
}
.workedex .wx-title { font-weight: 700; color: var(--accent2); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ---------- runner ---------- */
.runner-head { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-dim); }
.runner-head .timer { margin-left: auto; font-family: var(--mono); font-size: 16px; color: var(--accent); }
.runner-head .timer.low { color: var(--bad); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.45; } }

.qcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-top: 14px; }
.qcard .qtext { font-size: 16.5px; }
.qcard .qtext table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
.qcard .qtext th, .qcard .qtext td { border: 1px solid var(--line); padding: 4px 9px; }
.qcard .qtext td.num { text-align: right; font-family: var(--mono); }
.choices { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
.choice {
  text-align: left; border: 1px solid var(--line); background: var(--card2);
  border-radius: 10px; padding: 11px 14px; font-size: 14.5px; color: var(--ink);
  cursor: pointer; transition: border-color 0.1s;
}
.choice:hover { border-color: var(--info); }
.choice .key { display: inline-block; width: 21px; height: 21px; line-height: 21px; text-align: center;
  background: var(--line); border-radius: 6px; font-size: 12px; font-weight: 700; margin-right: 9px; }
.choice.correct { border-color: var(--accent2); background: color-mix(in srgb, var(--accent2) 14%, var(--card2)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card2)); }
.choice.dim { opacity: 0.55; }
.choice:disabled { cursor: default; }

.numrow { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.numrow input {
  background: var(--bg2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  font-family: var(--mono); font-size: 17px; padding: 10px 14px; width: 210px;
}
.numrow input:focus { outline: none; border-color: var(--accent); }
.numrow .unit { color: var(--ink-dim); font-size: 14px; }

textarea.writebox {
  width: 100%; min-height: 130px; background: var(--bg2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14.5px;
  font-family: inherit; margin-top: 14px;
}

.feedback { margin-top: 16px; border-radius: 10px; padding: 12px 16px; font-size: 14.5px; border: 1px solid; }
.feedback.good { border-color: var(--accent2); background: color-mix(in srgb, var(--accent2) 10%, transparent); }
.feedback.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.feedback.info { border-color: var(--info); background: color-mix(in srgb, var(--info) 8%, transparent); }
.feedback .fb-head { font-weight: 800; margin-bottom: 5px; }
.feedback .sol { color: var(--ink-dim); }
.feedback .sol b { color: var(--ink); }

.scorebox { text-align: center; padding: 30px 20px; }
.scorebox .big { font-size: 44px; font-weight: 800; font-family: var(--mono); }
.scorebox .verdict { font-size: 17px; margin: 6px 0 2px; }
.scorebox .xp { color: var(--gold); font-weight: 700; }

/* ---------- labs ---------- */
.labbrief { font-size: 14.5px; }
.labbrief summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 6px 0; }
.stepdots { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.stepdots span { width: 22px; height: 8px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); }
.stepdots span.done { background: var(--accent2); border-color: var(--accent2); }
.stepdots span.cur { background: var(--accent); border-color: var(--accent); }
.stepdots span.miss { background: var(--bad); border-color: var(--bad); }
.hintbox { margin-top: 10px; color: var(--ink-dim); font-size: 14px; border-left: 3px solid var(--info); padding-left: 12px; }

/* ---------- flashcards ---------- */
.flashcard {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  min-height: 220px; padding: 26px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; cursor: pointer; margin-top: 14px;
}
.flashcard .front { font-size: 22px; font-weight: 800; }
.flashcard .back { font-size: 15.5px; color: var(--ink-dim); margin-top: 14px; max-width: 640px; }
.flashcard .tap { font-size: 12px; color: var(--ink-faint); margin-top: 18px; text-transform: uppercase; letter-spacing: 1px; }
.gradebtns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

/* ---------- level banner ---------- */
.levelbar { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; flex-wrap: wrap; }
.levelbar .lvl { font-size: 30px; }
.levelbar .lvl-name { font-weight: 800; font-size: 17px; }
.levelbar .lvl-sub { font-size: 12.5px; color: var(--ink-faint); }
.levelbar .lvl-track { flex: 1 1 220px; }

.section-label { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--ink-faint); margin: 26px 0 10px; }

.rowitem { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--card); margin-bottom: 9px; cursor: pointer; }
.rowitem:hover { border-color: var(--accent); }
.rowitem .t { font-weight: 650; font-size: 14.5px; }
.rowitem .s { font-size: 12.5px; color: var(--ink-faint); }
.rowitem .right { margin-left: auto; font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; font-family: var(--mono); }
.rowitem.done-row { border-left: 3px solid var(--accent2); }

.footer-note { margin-top: 50px; font-size: 12px; color: var(--ink-faint); border-top: 1px solid var(--line); padding-top: 14px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 5px; background: var(--card2); }

@media (max-width: 640px) {
  .topbar .stats { display: none; }
  .wrap { padding: 16px 12px 70px; }
}

</style>
</head>
<body>
<div class="topbar">
  <div class="brand" onclick="location.hash='#/home'">⚡ WATT <span>STREET</span></div>
  <div class="stats" id="topstats"></div>
</div>
<div class="wrap" id="view">
  <noscript>Watt Street needs JavaScript — it runs entirely in your browser, no server, no accounts.</noscript>
  <p class="lead">Loading the trading floor…</p>
</div>
<script>
/* ============================================================================
   WATT STREET — Energy & Compute Analyst Academy
   Vanilla-JS game engine. No dependencies, no network. State in localStorage.
   ========================================================================== */
"use strict";

window.ACADEMY = window.ACADEMY || {};
ACADEMY.modules = ACADEMY.modules || [];
ACADEMY.gens = ACADEMY.gens || {};
ACADEMY.cases = ACADEMY.cases || [];
ACADEMY.decks = ACADEMY.decks || {};

/* ---------------------------------------------------------------- utils -- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
ACADEMY.rng = mulberry32(Date.now() & 0xffffffff);
ACADEMY.setSeed = function (s) { ACADEMY.rng = mulberry32(s); };

function rnd() { return ACADEMY.rng(); }
function ri(lo, hi) { return lo + Math.floor(rnd() * (hi - lo + 1)); }               // int inclusive
function rpick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function rstep(lo, hi, step) { const n = Math.round((hi - lo) / step); return lo + ri(0, n) * step; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fmt(x, d) {
  if (d === undefined) d = Math.abs(x) >= 100 ? 0 : Math.abs(x) >= 10 ? 1 : 2;
  return x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().replace(/[$,%\s]/g, "").replace(/x$/i, "");
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  if (t.startsWith("-")) { neg = true; t = t.slice(1); }
  const v = parseFloat(t);
  return isNaN(v) ? NaN : (neg ? -v : v);
}
function today() { return Math.floor(Date.now() / 864e5); }
function todayStr() { const d = new Date(); return d.toISOString().slice(0, 10); }

/* ---------------------------------------------------------------- state -- */
const SAVE_KEY = "wattstreet_v1";
let S = null;
function defaultSave() {
  return {
    xp: 0, drillBest: {}, bossBest: {}, labState: {}, lessonsRead: {},
    missed: [], srs: {}, streak: { last: "", n: 0 }, superday: { best: 0, taken: 0 },
    mission: { date: "", done: false }, stats: { answered: 0, correct: 0 }, theme: "auto"
  };
}
function load() {
  try { S = Object.assign(defaultSave(), JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); }
  catch (e) { S = defaultSave(); }
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* private mode */ } }

const LEVELS = [
  { xp: 0,    name: "Intern",              icon: "🪪" },
  { xp: 250,  name: "Junior Analyst",      icon: "📎" },
  { xp: 700,  name: "Analyst",             icon: "📊" },
  { xp: 1500, name: "Research Associate",  icon: "🧮" },
  { xp: 2600, name: "Senior Associate",    icon: "📈" },
  { xp: 4000, name: "Vice President",      icon: "🏛️" },
  { xp: 6000, name: "Director",            icon: "🎯" },
  { xp: 8500, name: "Managing Director",   icon: "👑" }
];
function levelOf(xp) {
  let cur = LEVELS[0], next = null;
  for (let i = 0; i < LEVELS.length; i++) {
    if (xp >= LEVELS[i].xp) cur = LEVELS[i];
    else { next = LEVELS[i]; break; }
  }
  return { cur, next };
}
function addXP(n) {
  const before = levelOf(S.xp).cur;
  S.xp += n; save();
  const after = levelOf(S.xp).cur;
  renderTopbar();
  if (after !== before) toast(`${after.icon} Promoted: <b>${after.name}</b>`, "gold");
}
function touchStreak() {
  const t = todayStr();
  if (S.streak.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak.n = (S.streak.last === y) ? S.streak.n + 1 : 1;
  S.streak.last = t; save(); renderTopbar();
}
function recordAnswer(key, ok) {
  S.stats.answered++; if (ok) S.stats.correct++;
  if (!ok && key) { S.missed = S.missed.filter(k => k !== key); S.missed.push(key); if (S.missed.length > 120) S.missed.shift(); }
  if (ok && key) S.missed = S.missed.filter(k => k !== key);
  touchStreak(); save();
}

/* ---------------------------------------------------------------- toast -- */
function toast(html, kind) {
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;" +
    "background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 20px;" +
    "font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .4s;";
  if (kind === "gold") el.style.borderColor = "var(--gold)";
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 450); }, 2200);
}

/* ------------------------------------------------------------ item pool -- */
function moduleById(id) { return ACADEMY.modules.find(m => m.id === id); }
function allDrillItems(mod) {
  const out = [];
  (mod.drills || []).forEach(d => d.items.forEach((it, i) => out.push({ it, key: mod.id + ":" + d.id + ":" + i })));
  return out;
}
function materialize(entry) {
  // entry: {it,key} where it may be a generator ref {t:'gen', g:'id'}
  if (entry.it.t === "gen") {
    const g = ACADEMY.gens[entry.it.g];
    const inst = g();
    inst.t = inst.t || "num";
    return { it: inst, key: "gen:" + entry.it.g };
  }
  return entry;
}
function modulePool(mod) {
  const pool = allDrillItems(mod);
  (mod.bossExtraGens || []).forEach(g => pool.push({ it: { t: "gen", g }, key: "gen:" + g }));
  return pool;
}
function findItemByKey(key) {
  if (key.startsWith("gen:")) return { it: { t: "gen", g: key.slice(4) }, key };
  const [mid, did, idx] = key.split(":");
  const mod = moduleById(mid); if (!mod) return null;
  const d = (mod.drills || []).find(x => x.id === did); if (!d) return null;
  const it = d.items[+idx]; if (!it) return null;
  return { it, key };
}

/* ---------------------------------------------------------------- shell -- */
function renderTopbar() {
  const lv = levelOf(S.xp);
  const due = dueCardCount();
  document.getElementById("topstats").innerHTML =
    `<span class="pill">⚡ <b>${fmt(S.xp, 0)}</b> XP</span>` +
    `<span class="pill">${lv.cur.icon} <b>${lv.cur.name}</b></span>` +
    `<span class="pill">🔥 <b>${S.streak.n}</b> day${S.streak.n === 1 ? "" : "s"}</span>` +
    (due ? `<span class="pill" style="cursor:pointer" onclick="location.hash='#/cards'">🃏 <b>${due}</b> due</span>` : "");
}
function setTheme() {
  // Explicit choice stamps the root; "auto" leaves the attribute to the OS media
  // query or an embedding viewer's own theme toggle (never fight an external stamp).
  if (S.theme === "light" || S.theme === "dark") {
    document.documentElement.setAttribute("data-theme", S.theme);
  }
}
function el(id) { return document.getElementById(id); }
function view(html) {
  stopTimer();
  el("view").innerHTML = html;
  window.scrollTo(0, 0);
}
function crumbs(parts) {
  return `<div class="crumbs">` + parts.map(p =>
    p.href ? `<a href="${p.href}">${p.label}</a>` : `<span>${p.label}</span>`).join(" › ") + `</div>`;
}

/* --------------------------------------------------------------- router -- */
function route() {
  const h = (location.hash || "#/home").slice(2).split("/");
  const [page, a, b] = h;
  try {
    if (page === "" || page === "home") return vHome();
    if (page === "module") return vModule(a);
    if (page === "lesson") return vLesson(a, b);
    if (page === "drill") return startDrill(a, b);
    if (page === "boss") return vBossIntro(a);
    if (page === "lab") return vLab(a);
    if (page === "cards") return vCards(a);
    if (page === "superday") return vSuperdayIntro();
    if (page === "mission") return startMission();
    if (page === "review") return startReview();
    if (page === "reference") return vReference();
    if (page === "settings") return vSettings();
    vHome();
  } catch (e) {
    el("view").innerHTML = `<div class="card"><h3>Something broke</h3><p class="desc">${esc(e.message)}</p>
      <button class="btn" onclick="location.hash='#/home'">Home</button></div>`;
    console.error(e);
  }
}

/* ----------------------------------------------------------------- home -- */
function moduleProgress(mod) {
  const lessons = (mod.lessons || []).length;
  const readN = (mod.lessons || []).filter(l => S.lessonsRead[mod.id + ":" + l.id]).length;
  const drills = (mod.drills || []).length;
  let dScore = 0;
  (mod.drills || []).forEach(d => { dScore += (S.drillBest[mod.id + ":" + d.id] || 0); });
  const dAvg = drills ? dScore / drills : 0;
  const boss = S.bossBest[mod.id] || 0;
  const pct = Math.round(100 * (0.3 * (lessons ? readN / lessons : 0) + 0.5 * dAvg + 0.2 * boss));
  return { pct, readN, lessons, dAvg, boss };
}
function vHome() {
  const lv = levelOf(S.xp);

  const due = dueCardCount();

  let modCards = ACADEMY.modules.map(m => {

  view(`
    <div class="levelbar">
      <div class="lvl">${lv.cur.icon}</div>

      <div class="lvl-track"><div class="progressbar"><div style="width:${pctToNext}%"></div></div></div>

    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
      <div class="card clickable" onclick="location.hash='#/mission'">

      </div>
      <div class="card clickable" onclick="location.hash='#/review'">
        <h3>🩹 Fix Your Misses</h3>

      </div>
      <div class="card clickable" onclick="location.hash='#/superday'">

/* --------------------------------------------------------------- module -- */
function vModule(id) {
  const m = moduleById(id); if (!m) return vHome();

    const read = S.lessonsRead[m.id + ":" + l.id];

      <div class="right">${best !== undefined ? "best " + Math.round(best * 100) + "%" : d.items.length + " q"}</div></div>`;

      <div class="right">${bossBest !== undefined ? "best " + Math.round(bossBest * 100) + "%" : "not taken"}</div>

}

function vLesson(mid, lid) {
  const m = moduleById(mid); if (!m) return vHome();

  const l = m.lessons[idx]; if (!l) return vModule(mid);

      <button class="btn primary" onclick="App.finishLesson('${m.id}','${l.id}', ${next ? `'${next.id}'` : "null"})">
        ${first ? "Mark read (+20 XP)" : "Done"} ${next ? "→ next lesson" : ""}</button>
      <button class="btn ghost" onclick="location.hash='#/module/${m.id}'">Back to desk</button>
    </div>
  `);
}

/* --------------------------------------------------------------- runner -- */
let R = null;   // runner session
let timerH = null;
function stopTimer() { if (timerH) { clearInterval(timerH); timerH = null; } }

/* Enter-key debounce: submitting with Enter focuses the Next button, and the same
   keystroke's trailing events would click it instantly, skipping feedback. */
let advLock = 0;
function lockAdvance() { advLock = Date.now() + 300; }
function advanceLocked() { return Date.now() < advLock; }

function startSession(items, opts) {
  R = Object.assign({
    items, i: 0, score: 0, pts: 0, ptsMax: 0, answered: false, results: [],
    mode: "drill", xpMult: 1, deferFeedback: false, timeLeft: 0, title: "Drill",
    backHash: "#/home", onDone: null
  }, opts);
  if (R.timeLeft > 0) {
    timerH = setInterval(() => {
      R.timeLeft--;
      const t = el("timer");
      if (t) { t.textContent = clock(R.timeLeft); if (R.timeLeft <= 60) t.classList.add("low"); }
      if (R.timeLeft <= 0) { stopTimer(); finishSession(true); }
    }, 1000);
  }
  renderQuestion();
}
function clock(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function startDrill(mid, did) {
  const m = moduleById(mid); if (!m) return vHome();
  const d = (m.drills || []).find(x => x.id === did); if (!d) return vModule(mid);
  let entries = d.items.map((it, i) => ({ it, key: mid + ":" + did + ":" + i }));
  if (d.shuffle !== false) entries = shuffle(entries);
  if (d.serve) entries = entries.slice(0, d.serve);
  startSession(entries.map(materialize), {
    mode: "drill", title: `${m.icon} ${d.title}`, backHash: "#/module/" + mid,
    onDone: (pct) => { const k = mid + ":" + did; if ((S.drillBest[k] || 0) < pct) S.drillBest[k] = pct; save(); }
  });
}

function vBossIntro(mid) {
  const m = moduleById(mid); if (!m) return vHome();
  const b = m.boss || {};
  view(`
    ${crumbs([{ label: "Home", href: "#/home" }, { label: m.title, href: "#/module/" + m.id }, { label: "Boss" }])}
    <div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:52px">👹</div>
      <h1>${b.title || m.title + " Exam"}</h1>
      <p class="lead">${b.count || 16} questions · ${Math.round((b.time || 1200) / 60)} minutes · pass ≥ ${Math.round((b.pass ?? 0.75) * 100)}%<br>
      No feedback until the end — just like a live client call.</p>
      <button class="btn primary" onclick="App.startBoss('${mid}')">Start</button>
    </div>`);
}
function startBoss(mid) {
  const m = moduleById(mid); const b = m.boss || {};
  const pool = shuffle(modulePool(m));
  const items = pool.slice(0, b.count || 16).map(materialize);
  startSession(items, {
    mode: "boss", title: `👹 ${m.title} Boss`, backHash: "#/module/" + mid,
    deferFeedback: true, timeLeft: b.time || 1200, xpMult: 1.5,
    onDone: (pct) => {
      if ((S.bossBest[mid] || 0) < pct) S.bossBest[mid] = pct;
      if (pct >= (b.pass ?? 0.75)) addXP(150);
      save();
    }
  });
}

function vSuperdayIntro() {
  view(`
    ${crumbs([{ label: "Home", href: "#/home" }, { label: "Superday" }])}
    <div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:52px">🏁</div>
      <h1>Superday</h1>
      <p class="lead">36 questions across every desk · 75 minutes · pass ≥ 75%.<br>
      This is the associate-seat interview gauntlet: accounting, DCF, comps, power, compute, project finance, judgment.<br>
      Best so far: <b>${Math.round(S.superday.best * 100)}%</b> (${S.superday.taken} attempts)</p>
      <button class="btn primary" onclick="App.startSuperday()">I'm ready</button>
    </div>`);
}
function startSuperday() {
  let items = [];
  ACADEMY.modules.forEach(m => {
    const pool = shuffle(modulePool(m));
    items = items.concat(pool.slice(0, Math.ceil(36 / ACADEMY.modules.length) + 1));
  });
  items = shuffle(items).slice(0, 36).map(materialize);
  startSession(items, {
    mode: "superday", title: "🏁 Superday", backHash: "#/home",
    deferFeedback: true, timeLeft: 75 * 60, xpMult: 2,
    onDone: (pct) => {
      S.superday.taken++;
      if (pct > S.superday.best) S.superday.best = pct;
      if (pct >= 0.75) addXP(400);
      save();
    }
  });
}

function startMission() {
  if (S.mission.date === todayStr() && S.mission.done) {
    view(`<div class="card" style="text-align:center;padding:40px"><div style="font-size:44px">🎯</div>
      <h2>Mission complete</h2><p class="lead">Come back tomorrow. Streak: 🔥 ${S.streak.n}</p>
      <button class="btn" onclick="location.hash='#/home'">Home</button></div>`);
    return;
  }
  let items = [];
  ACADEMY.modules.forEach(m => { items = items.concat(shuffle(modulePool(m)).slice(0, 2)); });
  items = shuffle(items).slice(0, 12).map(materialize);
  startSession(items, {
    mode: "mission", title: "🎯 Daily Mission", backHash: "#/home", xpMult: 1.25,
    onDone: () => { S.mission = { date: todayStr(), done: true }; save(); }
  });
}

function startReview() {
  if (!S.missed.length) { location.hash = "#/home"; return; }
  const entries = S.missed.slice(-25).map(findItemByKey).filter(Boolean).reverse();
  startSession(shuffle(entries).map(materialize), { mode: "review", title: "🩹 Fix Your Misses", backHash: "#/home" });
}

/* ------------------------------------------------------ question render -- */
function renderQuestion() {
  const n = R.items.length;
  if (R.i >= n) return finishSession(false);
  const { it } = R.items[R.i];
  R.answered = false;
  const head = `<div class="runner-head"><a href="${R.backHash}">✕ quit</a>
    <span>${R.title}</span><span class="num">${R.i + 1} / ${n}</span>
    <span class="num">✔ ${R.score}</span>
    ${R.timeLeft > 0 ? `<span class="timer" id="timer">${clock(R.timeLeft)}</span>` : ""}</div>`;

  let body = "";
  if (it.t === "mc" || it.t === "judge") {
    const order = it.noShuffle ? it.c.map((_, i) => i) : shuffle(it.c.map((_, i) => i));
    R.order = order;
    body = `<div class="choices">` + order.map((ci, pos) =>
      `<button class="choice" id="ch${pos}" onclick="App.answerMC(${ci},${pos})">
         <span class="key">${pos + 1}</span>${typeof it.c[ci] === "string" ? it.c[ci] : it.c[ci].text}</button>`).join("") + `</div>`;
  } else if (it.t === "num") {
    body = `<div class="numrow">
      <input id="numin" inputmode="decimal" autocomplete="off" placeholder="your answer"
             onkeydown="if(event.key==='Enter')App.answerNum()">
      <span class="unit">${it.unit || ""}</span>
      <button class="btn primary" onclick="App.answerNum()">Submit</button></div>`;
  } else if (it.t === "write") {
    body = `<textarea class="writebox" id="writein" placeholder="Draft it like it's going to the morning note..."></textarea>
      <div class="btnrow"><button class="btn primary" onclick="App.revealWrite()">Compare to the desk answer</button></div>`;
  }
  view(head + `<div class="qcard"><div class="qtext">${it.q}</div>${body}<div id="fb"></div><div id="nextrow"></div></div>`);
  const inp = el("numin"); if (inp) inp.focus();
}

function xpFor(it) {
  const d = it.diff || 1;
  const base = it.t === "num" ? 14 : it.t === "judge" ? 12 : 10;
  return Math.round(base * d * R.xpMult);
}

function answerMC(ci, pos) {
  if (R.answered) return; R.answered = true;
  const entry = R.items[R.i]; const it = entry.it;
  const isJudge = it.t === "judge";
  const best = isJudge ? it.c.reduce((m, c, i) => (it.c[i].pts > it.c[m].pts ? i : m), 0) : it.a;
  const ok = ci === best;
  const pts = isJudge ? it.c[ci].pts : (ok ? 1 : 0);
  const maxPts = isJudge ? Math.max(...it.c.map(c => c.pts)) : 1;
  R.pts += pts; R.ptsMax += maxPts;
  if (ok) R.score++;
  recordAnswer(entry.key, ok);
  R.results.push({ it, ok, picked: ci });
  // paint
  R.order.forEach((oc, p) => {
    const btn = el("ch" + p); if (!btn) return;
    btn.disabled = true;
    if (oc === best) btn.classList.add("correct");
    else if (oc === ci) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });
  if (!R.deferFeedback) {
    const note = isJudge ? (it.c[ci].note || "") : (it.why || "");
    const grade = isJudge ? `${it.c[ci].pts}/${maxPts} pts — ` : "";
    fb(ok ? "good" : "bad", (ok ? "✔ Right. " : "✘ Not quite. ") + grade, note);
    if (ok || pts > 0) addXP(Math.round(xpFor(it) * (isJudge ? pts / maxPts : 1)));
  } else setTimeout(nextQ, 350);
  if (!R.deferFeedback) nextBtn();
}

function answerNum() {
  if (R.answered) return;
  const entry = R.items[R.i]; const it = entry.it;
  const v = parseNum(el("numin").value);
  if (isNaN(v)) { el("numin").focus(); return; }
  R.answered = true;
  const tol = it.tol !== undefined ? it.tol : Math.max(Math.abs(it.ans) * 0.015, 0.01);
  const ok = Math.abs(v - it.ans) <= tol;
  if (ok) R.score++;
  R.pts += ok ? 1 : 0; R.ptsMax += 1;
  recordAnswer(entry.key, ok);
  R.results.push({ it, ok, picked: v });
  if (!R.deferFeedback) {
    fb(ok ? "good" : "bad",
      (ok ? "✔ Right: " : "✘ Answer: ") + `<span class="num">${fmt(it.ans, it.dp)}</span> ${it.unit || ""}`,
      it.sol || "");
    if (ok) addXP(xpFor(it));
    nextBtn();
  } else setTimeout(nextQ, 250);
}

function revealWrite() {
  if (R.answered) return; R.answered = true;
  const entry = R.items[R.i]; const it = entry.it;
  const yours = esc(el("writein").value || "(blank)");
  el("fb").innerHTML = `<div class="feedback info"><div class="fb-head">Desk answer</div>${it.model}
    <div style="margin-top:10px"><b>Rubric — score yourself:</b><ul>${it.rubric.map(r => `<li>${r}</li>`).join("")}</ul></div>
    <div style="margin-top:6px;color:var(--ink-faint);font-size:13px">Yours:<br><i>${yours.replace(/\n/g, "<br>")}</i></div></div>
    <div class="btnrow">
      <button class="btn" onclick="App.gradeWrite(0)">Missed it (0)</button>
      <button class="btn" onclick="App.gradeWrite(1)">Partial (1)</button>
      <button class="btn" onclick="App.gradeWrite(2)">Solid (2)</button>
      <button class="btn primary" onclick="App.gradeWrite(3)">Nailed it (3)</button></div>`;
}
function gradeWrite(g) {
  const entry = R.items[R.i];
  const ok = g >= 2;
  if (ok) R.score++;
  R.pts += g; R.ptsMax += 3;
  recordAnswer(entry.key, ok);
  R.results.push({ it: entry.it, ok, picked: g });
  if (ok) addXP(Math.round(8 * g * R.xpMult));
  nextQ();
}

function fb(kind, head, sol) {
  el("fb").innerHTML = `<div class="feedback ${kind}"><div class="fb-head">${head}</div>
    ${sol ? `<div class="sol">${sol}</div>` : ""}</div>`;
}
function nextBtn() {
  lockAdvance();
  el("nextrow").innerHTML = `<div class="btnrow"><button class="btn primary" id="nextbtn" onclick="App.nextQ()">
    ${R.i + 1 >= R.items.length ? "Finish" : "Next"} ↵</button></div>`;
  el("nextbtn").focus();
}
function nextQ() { if (advanceLocked()) return; R.i++; renderQuestion(); }

function finishSession(timedOut) {
  stopTimer();
  const n = Math.max(R.results.length, R.items.length);
  const pct = R.ptsMax > 0 ? R.pts / R.ptsMax : 0;
  if (R.onDone) R.onDone(pct);
  if (R.deferFeedback) {
    // award XP now
    let xp = 0;
    R.results.forEach(r => { if (r.ok) xp += xpFor(r.it); });
    if (xp) addXP(xp);
  }
  const passNeed = R.mode === "boss" || R.mode === "superday" ? 0.75 : null;
  const passed = passNeed === null ? null : pct >= passNeed;
  const review = R.deferFeedback ? R.results.map((r, i) => {
    const it = r.it;
    const ansTxt = it.t === "num" ? `${fmt(it.ans, it.dp)} ${it.unit || ""}` :
      it.t === "mc" ? (typeof it.c[it.a] === "string" ? it.c[it.a] : it.c[it.a].text) :
      it.t === "judge" ? it.c.reduce((m, c) => c.pts > m.pts ? c : m, it.c[0]).text : "—";
    return `<div class="rowitem" style="cursor:default">
      <div><div class="t">${r.ok ? "✅" : "❌"} Q${i + 1}. ${it.q.replace(/<[^>]+>/g, " ").slice(0, 110)}…</div>
      <div class="s"><b>Answer:</b> ${ansTxt}${it.sol ? " — " + it.sol.replace(/<[^>]+>/g, " ").slice(0, 160) : it.why ? " — " + it.why.replace(/<[^>]+>/g, " ").slice(0, 160) : ""}</div></div></div>`;
  }).join("") : "";
  view(`<div class="card scorebox">
      <div class="big" style="color:${pct >= 0.75 ? "var(--accent2)" : pct >= 0.5 ? "var(--accent)" : "var(--bad)"}">${Math.round(pct * 100)}%</div>
      <div class="verdict">${timedOut ? "⏰ Time. " : ""}${verdict(pct, passed)}</div>
      <div class="xp">score ${R.score}/${n}</div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn primary" onclick="location.hash='${R.backHash}';">Continue</button>
        ${R.mode === "drill" || R.mode === "review" ? `<button class="btn" onclick="location.reload()">⟳ Again</button>` : ""}
      </div></div>${review ? `<div class="section-label">Answer review</div>` + review : ""}`);
}
function verdict(p, passed) {
  if (passed === true) return "Cleared. The desk nods approvingly.";
  if (passed === false) return "Not yet — review the misses and come back.";
  if (p >= 0.9) return "Client-ready.";
  if (p >= 0.75) return "Solid — tighten the misses.";
  if (p >= 0.5) return "Getting there. Re-read the lesson, then re-run.";

}

function labAnswer(id) {

/* ------------------------------------------------------------ self test -- */
ACADEMY.selfTest = function (iters) {
  iters = iters || 40;
  const report = { gens: {}, cases: {}, counts: {}, errors: [] };
  Object.keys(ACADEMY.gens).forEach(gid => {
    try {
      for (let i = 0; i < iters; i++) {
        const inst = ACADEMY.gens[gid]();
        if (!inst.q || typeof inst.q !== "string") throw new Error("no q");
        if (inst.t === "mc" || inst.t === "judge") {
          if (!Array.isArray(inst.c) || inst.c.length < 2) throw new Error("bad choices");
          if (inst.t === "mc" && (inst.a === undefined || inst.a < 0 || inst.a >= inst.c.length)) throw new Error("bad answer idx");
        } else {
          if (!isFinite(inst.ans)) throw new Error("non-finite ans: " + inst.ans);
        }
      }
      report.gens[gid] = "ok";
    } catch (e) { report.gens[gid] = "FAIL: " + e.message; report.errors.push("gen " + gid + ": " + e.message); }
  });
  ACADEMY.cases.forEach(c => {
    try {
      c.steps.forEach((s, i) => {
        if (!isFinite(s.ans)) throw new Error("step " + (i + 1) + " non-finite");
      });
      report.cases[c.id] = c.steps.map(s => +s.ans.toFixed(4));
    } catch (e) { report.cases[c.id] = "FAIL: " + e.message; report.errors.push("case " + c.id + ": " + e.message); }
  });
  ACADEMY.modules.forEach(m => {
    let mc = 0, num = 0, gen = 0, other = 0;
    (m.drills || []).forEach(d => d.items.forEach(it => {
      if (it.t === "mc") { mc++; if (it.a === undefined || !it.c || it.a >= it.c.length) report.errors.push("bad mc in " + m.id + "/" + d.id); }
      else if (it.t === "num") { num++; if (!isFinite(it.ans)) report.errors.push("bad num in " + m.id + "/" + d.id); }
      else if (it.t === "gen") { gen++; if (!ACADEMY.gens[it.g]) report.errors.push("missing gen " + it.g); }
      else other++;
    }));
    report.counts[m.id] = { mc, num, gen, other, lessons: (m.lessons || []).length, cards: 0 };
  });
  Object.keys(ACADEMY.decks).forEach(dk => { report.counts["deck:" + dk] = ACADEMY.decks[dk].cards.length; });
  return report;
};

<tr><td>Free cash flow</td><td>CFO − capex (or EBITDA − interest − taxes − capex ± ΔNWC)</td><td>IPPs, everything; FCF yield = FCF ÷ market cap</td></tr>
</table></div>
<div class="workedex"><div class="wx-title">Worked example — the EBITDA mirage</div>
Two 500&nbsp;MW plants both print $200M EBITDA. Plant A is new (maintenance capex $15M); Plant B is 40 years old
($70M). Real cash engines: A = $185M, B = $130M — <b>30% apart</b> on identical EBITDA. Same trap with GPU fleets:
rental EBITDA looks fat until the 5-year replacement cycle eats it.</div>`;

const L4 = `
<p>A handful of accounting quirks show up constantly in energy coverage. Knowing them marks you as sector-literate.</p>
<h3>Regulated utility specials</h3>
<ul>
<li><b>AFUDC</b> (Allowance for Funds Used During Construction): while building a plant, a utility capitalizes its
financing cost into the asset and books it as (non-cash) income. Big construction cycle → AFUDC-heavy EPS →
lower earnings quality until the asset enters rates.</li>
<li><b>Regulatory assets/liabilities:</b> costs the regulator has promised you can bill customers later (a deferred
fuel balance after a spike) sit as assets; refunds owed sit as liabilities. They smooth earnings and reveal
regulatory lag.</li>
<li><b>CWIP</b> (construction work in progress): plant under construction, not yet depreciating, often not yet
earning (unless the regulator allows CWIP in rate base).</li>
</ul>
<h3>Everyone's specials</h3>
<ul>
<li><b>ARO</b> (asset retirement obligation): the discounted cost of tearing down/decommissioning — nuclear is the
famous one; wind/solar leases carry them too. It accretes through the IS like slow-motion interest.</li>
<li><b>MTM hedges:</b> generators hedge power and gas; unrealized mark-to-market swings whip GAAP net income around.
Analysts strip them: follow <i>adjusted</i> EBITDA and realized hedges. Always ask "what's hedged, at what price, how far out?"</li>
<li><b>Deferred taxes:</b> tax depreciation (MACRS — 5-year for solar/wind/batteries!) front-runs book depreciation,
so cash taxes &lt; book taxes early in asset life → a deferred tax liability builds. This is the raw material of
renewable tax equity.</li>
<li><b>Capitalized vs. expensed:</b> data center developers capitalize construction interest; GPU clouds capitalize
the fleet and depreciate over 4–6 years. Depreciation life assumptions move stated margins a lot — a favorite
short-seller battleground.</li>
</ul>
<div class="keybox"><b>Desk habit:</b> for any company you pick up, find (1) segment EBITDA bridge, (2) capex split
(maintenance/growth), (3) hedge disclosure table, (4) debt maturity ladder. Those four tables answer 80% of client
questions.</div>`;

ACADEMY.gens.acctDepCash = function () {
  const d = rpick([5, 10, 15, 20, 25]); const t = rpick([21, 25]);
  return { t: "num", q: `Depreciation increases by $${d}M this period (tax rate ${t}%). All else equal, what is the change in the company's <b>ending cash</b>?`,
    ans: d * t / 100, dp: 2, tol: 0.05, unit: "$M",
    sol: `NI falls ${d}×(1−${t}%) = ${fmt(d * (1 - t / 100), 2)}; CFS adds back the full ${d} → cash +${fmt(d * t / 100, 2)}. Depreciation is a tax shield: Δcash = D&A × tax rate.` };
};
ACADEMY.gens.acctDepNI = function () {
  const d = rpick([8, 10, 12, 16, 20]); const t = rpick([21, 25]);
  return { t: "num", q: `Depreciation increases by $${d}M (tax rate ${t}%). What is the change in <b>net income</b>? (negative = decrease)`,
    ans: -d * (1 - t / 100), dp: 2, tol: 0.05, unit: "$M",
    sol: `Pre-tax −${d}, taxes −${fmt(d * t / 100, 2)} → NI = −${d} × (1−${t}%) = ${fmt(-d * (1 - t / 100), 2)}.` };
};
ACADEMY.gens.acctCFO = function () {
  const ni = ri(80, 260), da = ri(30, 120), sbc = ri(5, 25);
  const dAR = ri(-20, 30), dInv = ri(-15, 25), dAP = ri(-15, 25);
  const cfo = ni + da + sbc - dAR - dInv + dAP;
  return { t: "num",
    q: `Compute <b>cash flow from operations</b> (indirect method), $M:
    <table><tr><td>Net income</td><td class="num">${ni}</td></tr>
    <tr><td>D&amp;A</td><td class="num">${da}</td></tr>
    <tr><td>Stock comp</td><td class="num">${sbc}</td></tr>
    <tr><td>Δ Accounts receivable</td><td class="num">${dAR >= 0 ? "+" : ""}${dAR}</td></tr>
    <tr><td>Δ Inventory</td><td class="num">${dInv >= 0 ? "+" : ""}${dInv}</td></tr>
    <tr><td>Δ Accounts payable</td><td class="num">${dAP >= 0 ? "+" : ""}${dAP}</td></tr></table>`,
    ans: cfo, dp: 0, tol: 0.6, unit: "$M",
    sol: `CFO = ${ni} + ${da} + ${sbc} − (${dAR}) − (${dInv}) + (${dAP}) = <b>${fmt(cfo, 0)}</b>. Asset increases use cash; liability increases source it.` };
};
ACADEMY.gens.acctDSO = function () {
  const rev = ri(60, 200) * 10; const dso = ri(30, 75);
  const ar = Math.round(rev * dso / 365);
  return { t: "num", q: `Accounts receivable are $${ar}M against annual revenue of $${fmt(rev, 0)}M. What is <b>DSO</b> (days sales outstanding)?`,
    ans: ar / rev * 365, dp: 1, tol: 0.8, unit: "days",
    sol: `DSO = AR ÷ revenue × 365 = ${ar}/${fmt(rev, 0)} × 365 = <b>${fmt(ar / rev * 365, 1)} days</b>.` };
};
ACADEMY.gens.acctCCC = function () {
  const dso = ri(25, 70), dio = ri(10, 60), dpo = ri(15, 65);
  return { t: "num", q: `DSO = ${dso} days, DIO = ${dio} days, DPO = ${dpo} days. What is the <b>cash conversion cycle</b>?`,
    ans: dso + dio - dpo, dp: 0, tol: 0.4, unit: "days",
    sol: `CCC = DSO + DIO − DPO = ${dso} + ${dio} − ${dpo} = <b>${dso + dio - dpo} days</b>.` };
};
ACADEMY.gens.acctEBITDA = function () {
  const rev = ri(40, 140) * 10;
  const cogs = Math.round(rev * rstep(0.45, 0.62, 0.01));
  const sga = Math.round(rev * rstep(0.12, 0.22, 0.01));
  const daInCogs = ri(15, 45), daInSga = ri(5, 20);
  const ebitda = rev - cogs - sga + daInCogs + daInSga;
  return { t: "num",
    q: `From this income statement extract ($M), compute <b>EBITDA</b>:
    <table><tr><td>Revenue</td><td class="num">${fmt(rev, 0)}</td></tr>
    <tr><td>COGS (includes ${daInCogs} of D&amp;A)</td><td class="num">${fmt(cogs, 0)}</td></tr>
    <tr><td>SG&amp;A (includes ${daInSga} of D&amp;A)</td><td class="num">${fmt(sga, 0)}</td></tr></table>`,
    ans: ebitda, dp: 0, tol: 0.6, unit: "$M",
    sol: `EBIT = ${fmt(rev, 0)} − ${fmt(cogs, 0)} − ${fmt(sga, 0)} = ${fmt(rev - cogs - sga, 0)}; add back total D&A ${daInCogs + daInSga} → EBITDA = <b>${fmt(ebitda, 0)}</b>.` };
};
ACADEMY.gens.acctFCF = function () {
  const ni = ri(90, 300), da = ri(40, 150), capex = ri(50, 180), dnwc = ri(-20, 40);
  const fcf = ni + da - capex - dnwc;
  return { t: "num", q: `Net income $${ni}M, D&amp;A $${da}M, capex $${capex}M, change in net working capital ${dnwc >= 0 ? "+" : ""}$${dnwc}M. Simple <b>free cash flow</b>?`,
    ans: fcf, dp: 0, tol: 0.6, unit: "$M",
    sol: `FCF = NI + D&A − capex − ΔNWC = ${ni} + ${da} − ${capex} − (${dnwc}) = <b>${fmt(fcf, 0)}</b>.` };
};

(function () {

const L1 = `
<p>Before any multiple or DCF makes sense, you need the two "values" straight. This is the most common screen-out
question in analyst interviews — and the most common comp-sheet bug on real desks.</p>
<h3>Equity value vs. enterprise value</h3>
<ul>
<li><b>Equity value (market cap)</b> = share price × <i>diluted</i> shares. What the shareholders' claim is worth.</li>
<li><b>Enterprise value (EV)</b> = value of the whole operating business, regardless of who financed it:</li>
</ul>
<div class="formula">EV = equity value + total debt + preferred stock + noncontrolling (minority) interest − cash &amp; equivalents<br>
(+ underfunded pensions, + finance leases, ± other debt-like items when material)</div>
<p><b>Why subtract cash?</b> A buyer of the business gets the cash box; it's not part of the operating engine.
<b>Why add minority interest?</b> Because consolidated EBITDA includes 100% of a subsidiary the parent doesn't fully
own — the numerator and denominator must claim the same perimeter. (Yieldcos and project partnerships make this a
live issue in renewables.)</p>
<div class="workedex"><div class="wx-title">Worked example</div>
Market cap $5,000M, debt $3,000M, minority interest $150M, preferred $250M, cash $400M →
EV = 5,000 + 3,000 + 150 + 250 − 400 = <b>$8,000M</b>.</div>
<h3>Diluted shares — the treasury stock method (TSM)</h3>
<div class="formula">Net new shares = in-the-money options × (1 − strike ÷ current price)<br>
Diluted shares = basic shares + net new option shares (+ RSUs + converts if in the money)</div>
<div class="workedex"><div class="wx-title">Worked example</div>
100M basic shares; 10M options struck at $20; stock at $50. Option holders pay 10M × $20 = $200M, which buys back
$200M ÷ $50 = 4M shares → net +6M → <b>106M diluted</b>. Out-of-the-money options add nothing.</div>
<div class="keybox"><b>Pairing rule (memorize):</b> EV pairs with metrics <i>before</i> interest (revenue, EBITDA,
EBIT, unlevered FCF). Equity value pairs with metrics <i>after</i> interest (net income/EPS, FCFE, book equity,
CAFD). Mixing them — "EV/net income" or "P/EBITDA" — is instant credibility damage.</div>`;

const L2 = `
<p>A DCF answers: what are the future cash flows of the operating business worth today? The cash flow you discount
is <b>unlevered free cash flow (UFCF)</b> — cash available to <i>all</i> capital providers, before financing choices.</p>
<div class="formula">UFCF = EBIT × (1 − tax rate)   [= NOPAT]<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; + D&amp;A (non-cash)<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; − capex<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; − increase in net working capital</div>
<p>No interest anywhere in it — leverage lives in the discount rate (WACC), not the cash flows. That's the
consistency rule: unlevered flows ↔ WACC; levered flows (FCFE) ↔ cost of equity.</p>
<h3>Building the forecast (5–10 years)</h3>
<ul>
<li><b>Revenue</b> from drivers, not vibes: MW × capacity factor × $/MWh for a generator; leased MW × $/kW-month for
a data center; GPUs × utilization × $/GPU-hr for compute. Tie growth to something physical or contractual.</li>
<li><b>Margins</b>: anchor to history and to unit economics (spark spreads, PPA prices, rent escalators).</li>
<li><b>Capex</b>: split maintenance vs. growth. If you model growth capex, model the revenue it buys — and vice versa.</li>
<li><b>ΔNWC</b>: % of Δrevenue is fine for a first pass.</li>
</ul>
<div class="workedex"><div class="wx-title">Worked example</div>
EBITDA $800M, D&amp;A $200M, tax 25%, capex $250M, ΔNWC +$30M.<br>
EBIT = 600 → NOPAT = 450 → UFCF = 450 + 200 − 250 − 30 = <b>$370M</b>.</div>
<div class="keybox"><b>Sanity ratios</b> the desk expects you to eyeball: capex vs. D&amp;A (a mature asset base spends
roughly its depreciation; growth spends more), UFCF conversion (UFCF/EBITDA typically 30–60% for asset-heavy names), and
whether terminal-year margins quietly assume the company becomes the best operator in history.</div>`;

const L3 = `
<h3>WACC — the blended cost of capital</h3>
<div class="formula">WACC = (E/V) × Re + (D/V) × Rd × (1 − tax) &nbsp;&nbsp; where V = E + D at <i>market</i> values, target weights<br>
Re (CAPM) = risk-free rate + β × equity risk premium &nbsp;(+ size premium for small caps)<br>
Unlever: βU = βL ÷ [1 + (1−t) × D/E] · Relever at the target D/E</div>
<div class="workedex"><div class="wx-title">Worked example</div>
rf 4.5%, β 1.2, ERP 5% → Re = 10.5%. Capital: 60% equity / 40% debt, pre-tax Rd 6%, tax 25% →
WACC = 0.6 × 10.5 + 0.4 × 6 × 0.75 = 6.3 + 1.8 = <b>8.1%</b>.</div>
<ul>
<li>Debt is cheaper than equity (senior claim, contractual) <i>and</i> interest is tax-deductible — hence the (1−t).</li>
<li>Peer betas must be unlevered then relevered to your target structure — raw betas embed each peer's leverage.</li>
<li>Regulated utilities: low β (~0.5–0.7), heavy cheap debt → WACC ~6–7%. Merchant power / GPU clouds: high β, expensive
debt → 9–13%. The discount rate should smell like the risk.</li>
</ul>
<h3>Terminal value — where DCFs are won and lost</h3>
<div class="formula">Gordon growth: TV = UFCF<sub>final</sub> × (1+g) ÷ (WACC − g), g ≈ long-run GDP/inflation (2–3%)<br>
Exit multiple: TV = terminal EBITDA × multiple &nbsp;→ always cross-check one against the other<br>
PV(TV) = TV ÷ (1 + WACC)<sup>N</sup></div>
<div class="workedex"><div class="wx-title">Worked example</div>
Final-year UFCF $500M, g 2%, WACC 8% → TV = 510 ÷ 0.06 = <b>$8,500M</b>; PV at year 5 = 8,500 ÷ 1.08⁵ =
<b>$5,785M</b>.</div>
<ul>
<li>TV is often 60–80% of EV. If it's above ~80%, extend the explicit window or admit you're valuing a guess.</li>
<li>Cross-check: what EV/EBITDA does your Gordon TV imply? What growth does your exit multiple imply? If your "2% growth"
implies 14× terminal EBITDA for a coal plant, start over.</li>
<li>Mid-year convention (discount at t−0.5) recognizes cash arrives through the year, not on Dec 31 — raises the PV a few percent.</li>
</ul>
<h3>From EV to a share price</h3>
<div class="formula">Equity value = EV − net debt − minority interest − preferred (± investments/JVs)<br>
Per share = equity value ÷ diluted shares → compare to market; run WACC × g sensitivity grid</div>`;

<tr><td>Midstream / pipelines</td><td>EV/EBITDA, DCF per unit, distribution coverage &amp; yield</td>
<td>Fee-based, volume-linked; investor base buys income</td></tr>
<tr><td>Data center REIT / colo</td><td>P/AFFO, EV/EBITDA, cap rates on stabilized NOI, $/MW, development yield spread</td>
<td>It's real estate: income + development pipeline</td></tr>
<tr><td>Neocloud / GPU compute</td><td>EV/EBITDA (carefully!), contracted backlog analysis, unit economics ($/GPU-hr vs. all-in cost), payback vs. depreciation life</td>
<td>Short asset lives and contract/counterparty risk make headline multiples treacherous</td></tr>
</table></div>
<ul>
<li><b>Sum-of-the-parts (SOTP)</b> for hybrids: a utility with a merchant fleet or a developer with an operating
portfolio — value each segment on its own method, subtract net debt and holdco costs. Watch for the "conglomerate discount" debate.</li>
<li><b>The football field:</b> present DCF, comps, precedent deals, and (where relevant) replacement cost side by side
as ranges. One number is a target; a field is an argument.</li>
<li><b>Reverse DCF:</b> back out what growth/margins the current price implies, then argue with <i>that</i>. Often more
persuasive than your own forecast.</li>
</ul>
<div class="keybox"><b>Desk reality:</b> the model rarely changes minds by itself — the <i>assumption you can defend
better than consensus</i> does. Valuation is the scoreboard; the variant perception is the game (Module 7).</div>`;

ACADEMY.gens.valTSM = function () {
  const sh = ri(80, 400); const opt = ri(5, 30);
  const px = rstep(30, 90, 5); const k = Math.round(px * rstep(0.3, 0.7, 0.05));
  const dil = sh + opt * (1 - k / px);
  return { t: "num", q: `${sh}M basic shares; ${opt}M options struck at $${k}; stock trades at $${px}. <b>Diluted share count</b> (treasury stock method)?`,
    ans: dil, dp: 1, tol: 0.3, unit: "M shares",
    sol: `Proceeds ${opt} × ${k} = ${fmt(opt * k, 0)} buys back ${fmt(opt * k / px, 2)}M shares → net +${fmt(opt * (1 - k / px), 2)}M → <b>${fmt(dil, 1)}M</b>.` };
};
ACADEMY.gens.valEV = function () {
  const mcap = ri(20, 90) * 100; const debt = ri(10, 80) * 100; const cash = ri(2, 25) * 100;
  const mi = rpick([0, 0, 150, 300, 600]); const pref = rpick([0, 0, 200, 400]);
  const ev = mcap + debt + mi + pref - cash;
  return { t: "num", q: `Market cap $${fmt(mcap, 0)}M, total debt $${fmt(debt, 0)}M, cash $${fmt(cash, 0)}M, minority interest $${mi}M, preferred $${pref}M. <b>Enterprise value</b>?`,
    ans: ev, dp: 0, tol: 1, unit: "$M",
    sol: `EV = ${fmt(mcap, 0)} + ${fmt(debt, 0)} + ${mi} + ${pref} − ${fmt(cash, 0)} = <b>${fmt(ev, 0)}</b>.` };
};
ACADEMY.gens.valEq = function () {
  const ev = ri(40, 160) * 100; const nd = Math.round(ev * rstep(0.2, 0.5, 0.05));
  const mi = rpick([0, 100, 250, 500]); const sh = ri(100, 500);
  const ps = (ev - nd - mi) / sh;
  return { t: "num", q: `Your DCF gives EV of $${fmt(ev, 0)}M. Net debt $${fmt(nd, 0)}M, minority interest $${mi}M, ${sh}M diluted shares. <b>Implied value per share</b>?`,
    ans: ps, dp: 2, tol: Math.max(ps * 0.01, 0.05), unit: "$/share",
    sol: `Equity = ${fmt(ev, 0)} − ${fmt(nd, 0)} − ${mi} = ${fmt(ev - nd - mi, 0)}; ÷ ${sh}M shares = <b>$${fmt(ps, 2)}</b>.` };
};
ACADEMY.gens.valUFCF = function () {
  const ebitda = ri(40, 150) * 10; const da = Math.round(ebitda * rstep(0.2, 0.4, 0.05));
  const t = rpick([21, 25]); const capex = Math.round(ebitda * rstep(0.25, 0.45, 0.05)); const dnwc = ri(-20, 40);
  const ufcf = (ebitda - da) * (1 - t / 100) + da - capex - dnwc;
  return { t: "num", q: `EBITDA $${fmt(ebitda, 0)}M, D&amp;A $${da}M, tax ${t}%, capex $${capex}M, ΔNWC ${dnwc >= 0 ? "+" : ""}$${dnwc}M. <b>Unlevered FCF</b>?`,
    ans: ufcf, dp: 1, tol: Math.max(Math.abs(ufcf) * 0.01, 0.6), unit: "$M",
    sol: `EBIT = ${fmt(ebitda - da, 0)}; NOPAT = ${fmt((ebitda - da) * (1 - t / 100), 1)}; +D&A ${da} − capex ${capex} − ΔNWC (${dnwc}) = <b>${fmt(ufcf, 1)}</b>.` };
};
ACADEMY.gens.valWACC = function () {
  const rf = rstep(3.5, 5, 0.25); const beta = rstep(0.6, 1.5, 0.05); const erp = rpick([4.5, 5, 5.5]);
  const wd = rstep(0.2, 0.5, 0.05); const rd = rstep(4.5, 8, 0.25); const t = rpick([21, 25]);
  const re = rf + beta * erp;
  const wacc = (1 - wd) * re + wd * rd * (1 - t / 100);
  return { t: "num", q: `Risk-free ${rf}%, beta ${fmt(beta, 2)}, ERP ${erp}%. Capital structure ${Math.round(wd * 100)}% debt at ${rd}% pre-tax; tax ${t}%. <b>WACC</b>? (answer in %, e.g. 8.1)`,
    ans: wacc, dp: 2, tol: 0.06, unit: "%",
    sol: `Re = ${rf} + ${fmt(beta, 2)}×${erp} = ${fmt(re, 2)}%. WACC = ${fmt(1 - wd, 2)}×${fmt(re, 2)} + ${fmt(wd, 2)}×${rd}×(1−${t}%) = <b>${fmt(wacc, 2)}%</b>.` };
};
ACADEMY.gens.valTV = function () {
  const fcf = ri(30, 90) * 10; const g = rstep(1.5, 2.5, 0.25); const w = rstep(7, 10.5, 0.25);
  const tv = fcf * (1 + g / 100) / ((w - g) / 100);
  return { t: "num", q: `Final-year (year 5) UFCF $${fmt(fcf, 0)}M, perpetuity growth ${g}%, WACC ${w}%. <b>Terminal value at year 5</b> (Gordon)?`,
    ans: tv, dp: 0, tol: tv * 0.01, unit: "$M",
    sol: `TV = ${fmt(fcf, 0)}×${fmt(1 + g / 100, 3)} ÷ (${w}% − ${g}%) = ${fmt(fcf * (1 + g / 100), 1)} ÷ ${fmt((w - g) / 100, 4)} = <b>${fmt(tv, 0)}</b>.` };
};
ACADEMY.gens.valPV = function () {
  const cf = ri(20, 120) * 100; const w = rstep(7, 11, 0.5); const n = ri(3, 7);
  const pv = cf / Math.pow(1 + w / 100, n);
  return { t: "num", q: `Discount $${fmt(cf, 0)}M received at the end of year ${n} back to today at ${w}%. <b>Present value</b>?`,
    ans: pv, dp: 0, tol: pv * 0.01, unit: "$M",
    sol: `PV = ${fmt(cf, 0)} ÷ ${fmt(1 + w / 100, 3)}<sup>${n}</sup> = ${fmt(cf, 0)} ÷ ${fmt(Math.pow(1 + w / 100, n), 4)} = <b>${fmt(pv, 0)}</b>.` };
};
ACADEMY.gens.valUnlever = function () {
  const bl = rstep(1.0, 1.8, 0.05); const de = rstep(0.4, 1.2, 0.1); const t = rpick([21, 25]);
  const bu = bl / (1 + (1 - t / 100) * de);
  return { t: "num", q: `A peer's levered beta is ${fmt(bl, 2)} with D/E of ${fmt(de, 1)} and tax ${t}%. <b>Unlevered beta</b>?`,
    ans: bu, dp: 3, tol: 0.015, unit: "",
    sol: `βU = ${fmt(bl, 2)} ÷ [1 + (1−${t}%)×${fmt(de, 1)}] = ${fmt(bl, 2)} ÷ ${fmt(1 + (1 - t / 100) * de, 3)} = <b>${fmt(bu, 3)}</b>.` };
};
ACADEMY.gens.valFCFyield = function () {
  const mcap = ri(30, 150) * 100; const fcf = Math.round(mcap * rstep(0.05, 0.14, 0.005));
  const y = fcf / mcap * 100;
  return { t: "num", q: `Free cash flow $${fmt(fcf, 0)}M against a $${fmt(mcap, 0)}M market cap. <b>FCF yield</b>? (%, e.g. 7.5)`,
    ans: y, dp: 1, tol: 0.15, unit: "%",
    sol: `${fmt(fcf, 0)} ÷ ${fmt(mcap, 0)} = <b>${fmt(y, 1)}%</b>. IPPs returning capital often trade on this — compare it to their buyback pace and to cost of equity.` };
};

<h3>Anatomy of a comp sheet (columns you'll build)</h3>
<ul>
<li><b>Identity:</b> ticker, subsector, market cap, ADV (liquidity).</li>

<tr><td>Grid equipment / turbines</td><td>P/E, EV/EBIT</td><td>~15–30×</td><td>Book-to-bill, backlog years, margin trajectory</td></tr>
</table></div>
<div class="keybox"><b>Cross-asset intuition:</b> when the SAME megawatt can be valued as a power plant ($/kW),
a lease stream (cap rate), or a compute engine ($/GPU-hr), the spread between those three answers is where the
2023–2026 AI-power trade lived. Analysts who could arbitrage the frameworks — "this IPP's fleet is worth 2× more as
data-center power" — were the ones who got the calls right.</div>`;

/* ------------------------------------------------------------ generators */
ACADEMY.gens.compEVmult = function () {
  const px = rstep(20, 160, 5); const sh = ri(150, 600);
  const debt = ri(20, 120) * 100; const cash = ri(3, 30) * 100;
  const e = ri(15, 60) * 100;
  const ev = px * sh + debt - cash;
  const m = ev / e;
  return { t: "num", q: `Price $${px}, diluted shares ${sh}M, debt $${fmt(debt, 0)}M, cash $${fmt(cash, 0)}M, 2026E EBITDA $${fmt(e, 0)}M. <b>EV / 2026E EBITDA</b>? (in ×, e.g. 9.6)`,
    ans: m, dp: 2, tol: 0.08, unit: "×",
    sol: `EV = ${px}×${sh} + ${fmt(debt, 0)} − ${fmt(cash, 0)} = ${fmt(ev, 0)}; ÷ ${fmt(e, 0)} = <b>${fmt(m, 2)}×</b>.` };
};
ACADEMY.gens.compPE = function () {
  const eps = rstep(1.5, 9, 0.05); const pe = rstep(9, 24, 0.5);
  const px = Math.round(eps * pe * 100) / 100;
  return { t: "num", q: `Stock at $${fmt(px, 2)}; 2026E EPS $${fmt(eps, 2)}. <b>P/E</b>? (×)`,
    ans: px / eps, dp: 1, tol: 0.15, unit: "×",
    sol: `${fmt(px, 2)} ÷ ${fmt(eps, 2)} = <b>${fmt(px / eps, 1)}×</b>.` };
};
ACADEMY.gens.compLev = function () {
  const e = ri(10, 50) * 100; const lev = rstep(1.5, 5, 0.1);
  const cash = ri(2, 15) * 100; const debt = Math.round(e * lev + cash);
  return { t: "num", q: `Debt $${fmt(debt, 0)}M, cash $${fmt(cash, 0)}M, EBITDA $${fmt(e, 0)}M. <b>Net leverage</b> (net debt / EBITDA, ×)?`,
    ans: (debt - cash) / e, dp: 2, tol: 0.05, unit: "×",
    sol: `(${fmt(debt, 0)} − ${fmt(cash, 0)}) ÷ ${fmt(e, 0)} = <b>${fmt((debt - cash) / e, 2)}×</b>. Rough guardrails: IPPs ~3×, utilities ~5× (at holdco+opco), midstream ~3.5–4.5×.` };
};
ACADEMY.gens.compGrowth = function () {
  const e1 = ri(80, 400) * 10; const g = rstep(3, 18, 0.5);
  const e2 = Math.round(e1 * (1 + g / 100));
  return { t: "num", q: `2026E EBITDA $${fmt(e1, 0)}M → 2027E $${fmt(e2, 0)}M. <b>Growth rate</b>? (%, one decimal)`,
    ans: (e2 / e1 - 1) * 100, dp: 1, tol: 0.15, unit: "%",
    sol: `${fmt(e2, 0)}/${fmt(e1, 0)} − 1 = <b>${fmt((e2 / e1 - 1) * 100, 1)}%</b>.` };
};
ACADEMY.gens.compCal = function () {
  const f1 = rstep(3, 8, 0.05); const f2 = Math.round(f1 * rstep(1.04, 1.15, 0.01) * 100) / 100;
  const cy = 0.5 * f1 + 0.5 * f2;
  return { t: "num", q: `A company's fiscal year ends June 30. FY2026E EPS (ends 6/30/26) is $${fmt(f1, 2)}; FY2027E is $${fmt(f2, 2)}. <b>Calendarized CY2026E EPS</b>?`,
    ans: cy, dp: 2, tol: 0.03, unit: "$",
    sol: `CY26 spans the back half of FY26 and front half of FY27 → 0.5×${fmt(f1, 2)} + 0.5×${fmt(f2, 2)} = <b>$${fmt(cy, 2)}</b>. Never mix fiscal bases in one comp column.` };
};

/* Module 4 — Power Markets & the Grid */
(function () {

const L1 = `
<p>Power has its own arithmetic. Analysts who can do these conversions in their head control every meeting. Fifteen
minutes here pays off for a career.</p>
<h3>Capacity vs. energy — the fundamental distinction</h3>
<div class="formula">Capacity (kW / MW / GW) = instantaneous capability, like an engine's horsepower<br>
Energy (kWh / MWh / TWh) = capacity × time, like miles driven<br>
1 GW = 1,000 MW = 1,000,000 kW · a year has <b>8,760 hours</b></div>
<ul>
<li><b>Capacity factor (CF)</b> = actual energy ÷ (nameplate × 8,760). Typical: nuclear ~90–95%, CCGT (running merchant)
~40–70%, onshore wind ~30–45%, solar ~20–30%, peakers ~5–15%.</li>
<li><b>Annual energy: MWh = MW × 8,760 × CF.</b> A 100 MW solar farm at 25% CF → 219,000 MWh/yr.</li>
<li>Rule of thumb: 1 MW of always-on power ≈ <b>~800 US homes</b> (avg home ≈ 10,500–11,000 kWh/yr). A 1&nbsp;GW data
center campus ≈ a city of 800k homes, running flat out 24/7.</li>
</ul>
<h3>Heat rate — the fuel-to-power exchange rate</h3>
<div class="formula">Heat rate (Btu/kWh) = fuel energy in ÷ electricity out. LOWER = more efficient.<br>
Thermal efficiency = 3,412 ÷ heat rate &nbsp;(3,412 Btu = 1 kWh)<br>
Fuel cost ($/MWh) = heat rate (Btu/kWh) × gas price ($/MMBtu) ÷ 1,000</div>
<div class="workedex"><div class="wx-title">Worked example</div>
A modern CCGT at 7,000 Btu/kWh is 3,412/7,000 = <b>48.7% efficient</b>. With gas at $3.50/MMBtu its fuel cost is
7,000 × 3.50 ÷ 1,000 = <b>$24.50/MWh</b>. An old peaker at 10,500 Btu/kWh pays $36.75/MWh for the same gas —
that ordering (efficiency) decides who runs.</div>
<div class="keybox"><b>Desk mnemonics:</b> 8,760 hours/yr · 3,412 Btu/kWh · fuel $/MWh ≈ heat rate (in thousands) ×
gas price (7 HR × $3.50 gas ≈ $24.5) · MWh/yr per kW = 8.76 × CF.</div>`;

const L2 = `
<p>Wholesale power prices come out of an auction run by grid operators (ISOs/RTOs) every five minutes to a day ahead.
Understanding the auction is understanding the sector.</p>
<h3>Merit order & marginal pricing</h3>
<ul>
<li>Generators offer at (roughly) marginal cost: renewables/nuclear near $0 (fuel-free or must-run), then efficient
CCGTs, then old gas/oil peakers.</li>
<li>The operator stacks offers cheapest-first until supply meets demand. <b>Everyone clears at the price of the last
(marginal) unit</b> — usually a gas plant, which is why <i>gas sets power prices</i> most hours in most US markets.</li>
<li>Inframarginal rent: a nuclear plant running at $5/MWh cost while gas sets the price at $45 keeps the $40 —
that's the IPP profit engine.</li>
</ul>
<h3>LMP — locational marginal price</h3>
<div class="formula">LMP = system energy price + congestion + losses</div>
<p>Prices differ by <i>node</i>. When wires are full (congestion), cheap generation gets bottled up and load pockets
pay premiums. <b>Basis</b> = your node's price vs. the liquid hub — a west Texas solar farm can see hub $35 while its
busbar clears $18 (or negative). Basis risk quietly kills bad PPAs.</p>
<h3>The market map (know these cold)</h3>
<div class="tablewrap"><table>
<tr><th>Market</th><th>Footprint</th><th>Design</th><th>Analyst notes</th></tr>
<tr><td>PJM</td><td>Mid-Atlantic + OH/IL</td><td>Energy + <b>capacity market</b> (RPM auctions)</td><td>Data center epicenter (N. Virginia); capacity prints are stock-moving events</td></tr>
<tr><td>ERCOT</td><td>Texas</td><td><b>Energy-only</b>, scarcity pricing, high offer caps</td><td>Fastest interconnection, wild volatility, huge renewables + new load</td></tr>
<tr><td>CAISO</td><td>California</td><td>Energy + state RA contracts</td><td>Solar duck curve, battery arbitrage lab</td></tr>
<tr><td>MISO / SPP</td><td>Midwest / plains</td><td>Energy + capacity constructs</td><td>Wind-heavy, big transmission builds</td></tr>
<tr><td>NYISO / ISO-NE</td><td>NY / New England</td><td>Energy + capacity</td><td>Gas constraints, high prices, policy overlays</td></tr>
<tr><td>Southeast/West (non-RTO)</td><td>Utilities' own systems</td><td>Vertically integrated, bilateral</td><td>Regulated returns, IRP processes drive capex</td></tr>
</table></div>
<h3>Two ways to keep the lights on</h3>
<ul>
<li><b>Capacity markets (PJM model):</b> pay generators $/MW-day, set years ahead in auctions, for being <i>available</i>.
Tight recent auctions cleared at record levels (hundreds of $/MW-day) as load growth met retirements — a windfall for
incumbent fleets and a core IPP bull thesis.</li>
<li><b>Energy-only (ERCOT model):</b> no capacity payments; scarcity hours with prices up to the multi-thousand-$/MWh

</ul>
<div class="keybox"><b>Ancillary services</b> (regulation, reserves, ERCOT's responsive reserve) are a small but
high-margin revenue stack — batteries feast on them early, then saturate them (watch ancillary price crush as
battery fleets grow).</div>`;

const L3 = `
<p>A generator's P&amp;L is a few spreads and one big fixed-cost line. You can model a fleet on a napkin if you know these.</p>
<h3>Spark spread — the gas generator's gross margin</h3>
<div class="formula">Spark spread ($/MWh) = power price − heat rate × gas price ÷ 1,000<br>
Dark spread = same idea with coal · "Clean" versions subtract carbon costs<br>
Implied market heat rate = power price ÷ gas price × 1,000 (Btu/kWh) — if it's above your unit's HR, you're in the money</div>
<div class="workedex"><div class="wx-title">Worked example</div>

heat rate = 45/3.5 × 1,000 = <b>12,857</b> — every unit more efficient than that runs profitably this hour.</div>
<h3>Annual generator EBITDA on a napkin</h3>
<div class="formula">EBITDA ≈ MW × 8,760 × CF × realized spread − fixed O&amp;M ± capacity/ancillary revenue</div>
<div class="workedex"><div class="wx-title">Worked example</div>

<ul>
<li>You don't get paid on nameplate. <b>UCAP</b> (unforced capacity) haircuts for forced outages; <b>ELCC</b> (effective

<li>ELCC-style ratings fall with penetration: the first solar farm helps a summer-peaking grid a lot; the 50th just

<div class="workedex"><div class="wx-title">Worked example</div>

const L4 = `
<p>LCOE answers: what average price must this plant earn per MWh over its life to cover capex, opex and its cost of
capital? It's the sector's universal cost yardstick — and it's routinely abused. Know both.</p>
<h3>The formula (annualize the capex, divide by the energy)</h3>
<div class="formula">Capital recovery factor: CRF = r(1+r)ⁿ ÷ [(1+r)ⁿ − 1] — turns capex into a level annual payment<br>
LCOE ($/MWh) = [capex($/kW) × CRF + fixed O&amp;M($/kW-yr)] ÷ (8.76 × CF) + variable O&amp;M + fuel ($/MWh)</div>
<div class="workedex"><div class="wx-title">Worked example — utility solar</div>
Capex $1,200/kW, 7% for 30 years → CRF = 0.0806 → $96.7/kW-yr + $20 fixed O&amp;M = $116.7/kW-yr. At 25% CF a kW
produces 8.76 × 0.25 = 2.19 MWh/yr → LCOE = 116.7 ÷ 2.19 ≈ <b>$53/MWh</b> (no fuel). Tax credits can cut this by
a third or more — which is how PPAs got so cheap.</div>
<h3>Where LCOE lies to you</h3>
<ul>
<li><b>It ignores WHEN the energy comes.</b> Solar at $50 that clears $28 midday (cannibalized) is worse than a
peaker at $150 that clears scarcity hours. Value-adjusted metrics (net-CONE comparisons, capacity value) matter.</li>
<li><b>It ignores location</b> — basis and congestion can be ±$15/MWh.</li>
<li><b>Financing moves it.</b> The same solar farm at 5% vs. 9% discount rate is a ~30% LCOE swing — renewables are
rate-sensitive assets.</li>
</ul>
<h3>Cost of new entry (CONE) anchors long-run prices</h3>
<p>If market prices/capacity revenues stay above the cost of building new supply, new build should eventually cap
prices — that's the mean-reversion anchor for merchant valuations. The mid-2020s twist: <b>you often can't build even
when you want to</b> — gas turbines sold out for years, new CCGT capex roughly doubled, interconnection queues run
multi-year. Scarcity of the <i>ability to build</i> extended the earnings runway of existing fleets: the single most

const L5 = `
<p>Merchant risk is what you hedge away. The contract stack — PPAs, hedges, credits — is where energy finance
actually happens, and it's exactly what a research associate gets asked about.</p>
<h3>PPA anatomy (power purchase agreement)</h3>
<ul>
<li><b>Buyer:</b> utility, corporate (hyperscalers are the biggest buyers on earth now), or trader. Term 10–25 yrs.</li>
<li><b>Settlement point:</b> <b>busbar</b> (at the plant — buyer takes basis risk) vs. <b>hub</b> (liquid point —
<i>seller</i> keeps basis risk between plant node and hub). Under-appreciated: many "fully contracted" projects still
carry basis risk.</li>
<li><b>Volume:</b> as-generated (buyer takes shape) vs. fixed-shape/firm (seller must cover shortfalls — dangerous).</li>
<li><b>Price:</b> fixed with escalator, or indexed with floors/collars. Also proxy revenue swaps &amp; hedges that
guarantee a revenue level rather than a price.</li>
</ul>
<div class="keybox"><b>Shape risk / cannibalization:</b> solar output is correlated — every farm produces at the same
hour, crushing midday prices (the duck curve). A solar project's <i>captured</i> price falls relative to average
prices as penetration grows. Model captured-price discounts, not flat hub prices.</div>
<h3>RECs & carbon</h3>
<p>Renewable Energy Certificates (1 REC = 1 MWh of renewable generation) sell separately from energy; state RPS
programs set demand. Some markets add carbon costs (RGGI, California) that raise fossil marginal costs — effectively
a subsidy to non-emitting fleets.</p>
<h3>Tax credits — the renewable capital stack's engine (mechanics &gt; statute)</h3>
<ul>
<li><b>ITC</b> (investment tax credit): % of eligible capex (base 30% with adders for energy communities/domestic
content in recent law) taken at COD. Favors capex-heavy, lower-CF assets (storage!).</li>
<li><b>PTC</b> (production tax credit): $/MWh for 10 years, inflation-indexed (high-$20s/MWh area recently). Favors
high-CF assets (wind, and now nuclear's separate 45U credit, which acts as a revenue floor in the low-$40s/MWh area
for existing plants).</li>
<li><b>Transferability:</b> post-2022 law allows selling credits for cash (~$0.90–0.95 per $1) — simpler than classic
tax equity and it reshaped project capital stacks.</li>
<li><b>Policy risk is live:</b> 2025 legislation accelerated phase-outs for wind/solar credits (construction-start
deadlines, sourcing restrictions). For any real deal: check current law, and treat credit timing as a underwriting
assumption, not a constant of nature.</li>
</ul>
<h3>Hedge disclosure — the IPP tell</h3>
<p>IPPs disclose % hedged by year and average hedge prices. The stock's earnings power = hedged block (locked) +
open block (exposed to the curve). When forwards rise, the open years re-rate first — that's why "% hedged 2027"
tables are in every IPP deck and every analyst model.</p>`;

const L6 = `
<p>The 2020s grid story: demand woke up after 15 flat years, and the wires/equipment/queues couldn't keep up.
Transmission and interconnection stopped being plumbing and became the investment thesis.</p>
<h3>Transmission — a regulated compounder</h3>
<ul>
<li>Interstate transmission rates are <b>FERC-regulated</b> (vs. state PUCs for distribution/retail): formula rates,
allowed ROEs historically ~9.5–10.5%, often with incentive adders. Revenue certainty + huge capex need = classic
rate-base compounding.</li>
<li>National build-out drivers: renewables in remote places, reliability (storms), and now load growth. Multi-billion
regional portfolios (e.g., MISO's long-range tranches) set multi-year capex visibility for utilities/equipment makers.</li>
<li>Congestion revenue rights / FTRs hedge congestion — traders' tools worth knowing exist.</li>
</ul>
<h3>Interconnection — the queue is the moat</h3>
<ul>
<li>Generators (and large loads!) must apply to connect; studies determine <b>network upgrade</b> costs the applicant
funds. Queues stretched to multi-year waits with thousands of GW of (mostly solar/storage) projects — many
speculative, but the delay is real.</li>
<li>Reforms (cluster studies, readiness deposits) are grinding through. Until they work, <b>speed-to-power beats
price</b>: assets with existing interconnection (retiring coal sites, existing plants) carry scarcity premiums.</li>
</ul>
<h3>Equipment: the physical bottleneck</h3>
<ul>
<li>Large power transformers: multi-year lead times. HV breakers, cable: stretched. Gas turbines: order books sold out
years ahead; prices up sharply. Nuclear: restarts and uprates first (cheapest MW), SMRs late-decade at best.</li>
<li>Analyst takeaway: bottleneck vendors (turbines, transformers, switchgear, EPC) became growth stocks; backlog and
book-to-bill are their KPIs.</li>
</ul>
<h3>The load-growth supercycle & compute</h3>
<ul>
<li>US data centers consumed roughly ~4% of US electricity in 2024 with credible projections of ~7–12% by 2028–2030
(ranges vary; treat precision skeptically). National load growth forecasts moved from ~0.5%/yr to ~2%+/yr —
transformational for a sector priced for zero growth.</li>
<li>Hyperscalers contract power like sovereigns: 20-year nuclear PPAs (including restart deals), giant solar
portfolios, and interest in SMRs. Premium prices for firm, clean, <i>fast</i> power.</li>
<li><b>Co-location / behind-the-meter (BTM)</b> — plugging a data center directly into a plant — collided with
regulators (who pays for the grid?). Front-of-meter deals with grid charges became the default; the fight itself is
a recurring research topic.</li>
<li>Bridge power: on-site gas turbines, fuel cells, and batteries fill the gap while grid interconnections wait —
new demand for everything from aeroderivatives to behind-fence microgrids.</li>
</ul>
<div class="keybox"><b>The one-slide thesis of this era:</b> demand inflected (AI/electrification/onshoring), supply
of firm capacity is constrained (retirements + queues + equipment), so scarcity accrues to whoever already owns
capacity, wires, or the ability to deliver power fast. Every energy stock pitch since 2023 is a variation on this
slide — know its numbers and its counterarguments (demand-forecast overshoot, efficiency gains, political backlash
on consumer bills, eventual supply response).</div>`;
