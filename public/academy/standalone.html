ACADEMY.gens.powEnergy = function () {
  const tech = rpick([
    { n: "nuclear plant", cf: [90, 95] }, { n: "CCGT", cf: [45, 70] },
    { n: "onshore wind farm", cf: [32, 45] }, { n: "solar farm", cf: [20, 30] }]);
  const mw = rpick([50, 100, 150, 200, 300, 500, 800, 1000]);
  const cf = ri(tech.cf[0], tech.cf[1]);
  const gwh = mw * 8760 * cf / 100 / 1000;
  return { t: "num", q: `A ${mw} MW ${tech.n} runs at a ${cf}% capacity factor. <b>Annual generation in GWh</b>?`,
    ans: gwh, dp: 0, tol: gwh * 0.01, unit: "GWh",
    sol: `${mw} × 8,760 × ${cf}% = ${fmt(mw * 8760 * cf / 100, 0)} MWh = <b>${fmt(gwh, 0)} GWh</b>.` };
};
ACADEMY.gens.powFuelCost = function () {
  const hr = rstep(6400, 10500, 100); const gas = rstep(2.5, 5, 0.25);
  return { t: "num", q: `A gas unit has a heat rate of ${fmt(hr, 0)} Btu/kWh; gas costs $${fmt(gas, 2)}/MMBtu. <b>Fuel cost per MWh</b>?`,
    ans: hr * gas / 1000, dp: 2, tol: 0.15, unit: "$/MWh",
    sol: `${fmt(hr, 0)} × ${fmt(gas, 2)} ÷ 1,000 = <b>$${fmt(hr * gas / 1000, 2)}/MWh</b>.` };
};
ACADEMY.gens.powEff = function () {
  const hr = rstep(6300, 11000, 100);
  const eff = 3412 / hr * 100;
  return { t: "num", q: `Convert a heat rate of ${fmt(hr, 0)} Btu/kWh into <b>thermal efficiency</b> (%).`,
    ans: eff, dp: 1, tol: 0.3, unit: "%",
    sol: `Efficiency = 3,412 ÷ ${fmt(hr, 0)} = <b>${fmt(eff, 1)}%</b>. (3,412 Btu = 1 kWh.)` };
};
ACADEMY.gens.powSpark = function () {
  const hr = rstep(6500, 8000, 100); const gas = rstep(2.5, 5, 0.25);
  const p = rstep(30, 90, 1);
  const ss = p - hr * gas / 1000;
  return { t: "num", q: `Power at the hub is $${fmt(p, 0)}/MWh; gas is $${fmt(gas, 2)}/MMBtu; your CCGT's heat rate is ${fmt(hr, 0)} Btu/kWh. <b>Spark spread</b>?`,
    ans: ss, dp: 2, tol: 0.2, unit: "$/MWh",
    sol: `Fuel = ${fmt(hr, 0)}×${fmt(gas, 2)}/1,000 = ${fmt(hr * gas / 1000, 2)} → spark = ${fmt(p, 0)} − ${fmt(hr * gas / 1000, 2)} = <b>$${fmt(ss, 2)}</b>.` };
};
ACADEMY.gens.powImpliedHR = function () {
  const gas = rstep(2.5, 5, 0.25); const p = rstep(28, 80, 1);
  const ihr = p / gas * 1000;
  return { t: "num", q: `Power $${fmt(p, 0)}/MWh, gas $${fmt(gas, 2)}/MMBtu. <b>Market implied heat rate</b> (Btu/kWh)?`,
    ans: ihr, dp: 0, tol: ihr * 0.01, unit: "Btu/kWh",
    sol: `${fmt(p, 0)} ÷ ${fmt(gas, 2)} × 1,000 = <b>${fmt(ihr, 0)}</b>. Units more efficient than this are in the money this hour.` };
};
ACADEMY.gens.powCapRev = function () {
  const mw = rpick([200, 300, 400, 500, 700, 900, 1100]); const p = rstep(100, 340, 10);
  const rev = mw * p * 365 / 1e6;
  return { t: "num", q: `A generator clears ${fmt(mw, 0)} MW of UCAP in a capacity auction at $${fmt(p, 0)}/MW-day. <b>Annual capacity revenue</b>?`,
    ans: rev, dp: 1, tol: Math.max(rev * 0.01, 0.1), unit: "$M",
    sol: `${fmt(mw, 0)} × ${fmt(p, 0)} × 365 = <b>$${fmt(rev, 1)}M</b>. This is pure margin against fixed costs — why auction prints move IPP stocks.` };
};
ACADEMY.gens.powGenEBITDA = function () {
  const mw = rpick([350, 450, 550, 650, 800]); const cf = ri(45, 70);
  const ss = rstep(12, 30, 1); const fom = ri(18, 40);
  const e = mw * 8760 * cf / 100 * ss / 1e6 - fom;
  return { t: "num", q: `Napkin a merchant CCGT's <b>annual energy-margin EBITDA</b>: ${mw} MW, ${cf}% capacity factor, average realized spark spread $${fmt(ss, 0)}/MWh, fixed costs $${fom}M/yr. (Ignore capacity revenue.)`,
    ans: e, dp: 1, tol: Math.max(e * 0.015, 0.5), unit: "$M",
    sol: `${mw} × 8,760 × ${cf}% = ${fmt(mw * 8760 * cf / 100 / 1e6, 2)}M MWh × $${fmt(ss, 0)} = ${fmt(mw * 8760 * cf / 100 * ss / 1e6, 1)} − ${fom} = <b>$${fmt(e, 1)}M</b>.` };
};
ACADEMY.gens.powBattery = function () {
  const mwh = rpick([100, 200, 400, 600, 800]); const rte = rpick([85, 88, 90]);
  const ch = rstep(10, 30, 1); const dis = rstep(50, 95, 1); const cyc = rpick([300, 330, 350, 365]);
  const daily = mwh * (rte / 100 * dis - ch);
  const ann = daily * cyc / 1e6;
  return { t: "num", q: `A battery charges its full ${fmt(mwh, 0)} MWh at $${fmt(ch, 0)}/MWh and discharges at $${fmt(dis, 0)}/MWh with ${rte}% round-trip efficiency, ${cyc} cycles/yr. <b>Annual arbitrage margin</b>?`,
    ans: ann, dp: 2, tol: Math.max(ann * 0.015, 0.05), unit: "$M",
    sol: `Daily: ${fmt(mwh, 0)}×${rte}%×${fmt(dis, 0)} − ${fmt(mwh, 0)}×${fmt(ch, 0)} = $${fmt(daily, 0)} → × ${cyc} = <b>$${fmt(ann, 2)}M</b>.` };
};
ACADEMY.gens.powCRF = function () {
  const r = rstep(5, 10, 0.5); const n = rpick([20, 25, 30, 35]);
  const crf = (r / 100) * Math.pow(1 + r / 100, n) / (Math.pow(1 + r / 100, n) - 1);
  return { t: "num", q: `Capital recovery factor for ${r}% over ${n} years? (4 decimals, e.g. 0.0806)`,
    ans: crf, dp: 4, tol: 0.001, unit: "",
    sol: `CRF = r(1+r)ⁿ/[(1+r)ⁿ−1] = <b>${fmt(crf, 4)}</b> → $1 of capex costs $${fmt(crf, 4)}/yr to carry.` };
};
ACADEMY.gens.powLCOE = function () {
  const capex = rstep(900, 1700, 50); const crf = rpick([0.075, 0.0806, 0.088, 0.094]);
  const fom = ri(15, 30); const cf = ri(22, 42);
  const lcoe = (capex * crf + fom) / (8.76 * cf / 100);
  return { t: "num", q: `LCOE for a renewables project: capex $${fmt(capex, 0)}/kW, CRF ${fmt(crf, 4)}, fixed O&amp;M $${fom}/kW-yr, capacity factor ${cf}%. No fuel or variable O&amp;M. <b>LCOE</b>?`,
    ans: lcoe, dp: 1, tol: Math.max(lcoe * 0.015, 0.4), unit: "$/MWh",
    sol: `Annual carrying = ${fmt(capex, 0)}×${fmt(crf, 4)} + ${fom} = $${fmt(capex * crf + fom, 1)}/kW-yr; energy = 8.76×${cf}% = ${fmt(8.76 * cf / 100, 2)} MWh/kW-yr → <b>$${fmt(lcoe, 1)}/MWh</b>.` };
};

<b>megawatts</b> — power is both the input and the unit of account. Master the physical layer first; the finance is easy after.</p>
<h3>IT load vs. facility load — PUE</h3>
<div class="formula">PUE (power usage effectiveness) = total facility power ÷ IT power<br>
Facility MW = IT MW × PUE &nbsp;·&nbsp; modern hyperscale PUE ≈ 1.15–1.35 (older/retail 1.5–1.8)</div>
<ul>
<li><b>IT (critical) load</b>: servers, storage, network — what the tenant pays rent on.</li>
<li>The overhead above 1.0 is cooling, power conversion losses, lighting. A 100 MW IT hall at PUE 1.25 pulls
125 MW from the grid. Utilities see the 125; leases price the 100. Keep the two straight in every model.</li>
<li>Liquid cooling (needed for dense AI racks) improves PUE and enables the density jump.</li>
</ul>
<h3>Reliability is the product: redundancy tiers</h3>
<ul>
<li><b>N</b> = just enough equipment; <b>N+1</b> = one spare of each critical component; <b>2N</b> = fully duplicated paths.
Tier III (concurrently maintainable) ≈ the commercial standard; Tier IV (fault-tolerant) for the paranoid.</li>
<li>Uptime is sold in nines: 99.99% ≈ 53 minutes of downtime a year, backed by SLAs with penalty teeth. Generators +
UPS + batteries bridge grid failures.</li>
<li>Some AI <i>training</i> capacity is now built cheaper (N, no generators) — training can tolerate interruptions;
inference and enterprise workloads cannot. Watch this distinction in build costs and lease rates.</li>
</ul>
<h3>Density — the AI discontinuity</h3>
<ul>
<li>Classic enterprise racks: 5–15 kW. AI training racks: 40–130+ kW (a GB200-class NVL rack is ~120–132 kW).
Density forced liquid cooling, new electrical topologies, and made <i>power</i> — not floor space — the binding constraint.</li>
<li>Rule of thumb: an H100-class GPU is ~700 W of chip; all-in (server overhead, networking, storage, cooling at
facility PUE) plan roughly <b>1.2–1.5 kW per GPU</b>. 10,000 GPUs ≈ 13–15 MW of facility load — a small town.</li>
</ul>
<div class="keybox"><b>Vocabulary that signals fluency:</b> "critical IT MW" (the leased quantity), "powered shell"
(building + utility power, tenant does fit-out), "turnkey" (fully fitted), "commissioned vs. contracted vs.
operational MW" (pipeline stages). Announcements quote whichever is biggest; analysts reconcile them.</div>`;

const L2 = `
<p>Data center leasing is industrial real estate with a power meter. The economics run on four numbers: rent per kW,
cost per MW, yield on cost, and the exit cap rate.</p>
<h3>The lease</h3>
<ul>
<li><b>Pricing:</b> $/kW of critical IT load per month. Teaching ranges (early 2026): hyperscale/wholesale roughly
$95–140/kW-mo on new signings (up ~40%+ from the 2020–22 trough); retail colo $130–200+. Tight markets (N. Virginia)
at the top.</li>
<li><b>Structure:</b> hyperscale deals are 10–15+ year <b>triple-net (NNN)</b> leases — tenant pays power, most opex —
with 2–3% annual escalators and investment-grade signatures. That's a corporate bond stapled to a building.</li>
<li><b>Power pass-through:</b> tenants pay their own electricity (metered); the landlord's margin is the rent, not the power.</li>
<li><b>Churn & mark-to-market:</b> legacy leases signed in the cheap era re-price UP on renewal in tight markets — a
rare landlord gift; retail colo has churn risk instead.</li>
</ul>
<h3>Development math (the value creation engine)</h3>
<div class="formula">Total cost ≈ land + shell (~$2–3M/MW) + fit-out (~$7–9M/MW) ≈ <b>$9–13M per IT MW</b> (ex-IT gear, which is the tenant's)<br>
Stabilized NOI = rent × kW × 12 − non-recovered costs<br>
<b>Yield on cost = NOI ÷ total cost</b> (target ~9–12%) &nbsp;vs.&nbsp; <b>exit cap rate ~5.75–7%</b><br>
Development profit = NOI ÷ cap − cost — the spread between those two rates, capitalized</div>
<div class="workedex"><div class="wx-title">Worked example</div>
48 MW at $11M/MW ≈ $528M cost. Rent $115/kW-mo → NOI ≈ 48,000 × 115 × 12 ≈ $66M → yield on cost 12.5%. Value at a
6.25% cap = $1.06B → <b>~$530M of development profit</b>, mostly earned the day the lease is signed. This spread is
why private capital flooded the sector.</div>
<h3>What can kill it</h3>
<ul>
<li><b>Speed-to-power:</b> a site without timely utility power is a field. Interconnection timing is the #1 diligence item.</li>

Watch vacancy, pre-leasing %, and rate trends by market.</li>
<li><b>Cap-rate risk:</b> a 6.25% → 7.25% move cuts exit value ~14%. Rate-sensitive, like all real estate.</li>
<li><b>Single-tenant risk:</b> one credit, one building, one workload type (training vs. inference matters for re-leasability).</li>
</ul>`;

const L3 = `
<p>A neocloud (GPU cloud — think CoreWeave-style) buys GPUs, wires them into clusters, and rents them by the hour.
The business model is a leasing company wearing a tech multiple — analyze it like a lessor.</p>

<div class="formula">Revenue/GPU-yr = $/GPU-hr × 8,760 × utilization<br>

<div class="workedex"><div class="wx-title">Worked example</div>

close to the asset's competitive life. Now you understand every bull-bear fight in the sector.</div>
<h3>Contracted vs. on-demand</h3>
<ul>
<li><b>Take-or-pay committed contracts</b> (2–5 yrs, often prepaid in part): lower rate, ~100% effective utilization,
financeable. This is what lenders lend against.</li>
<li><b>On-demand:</b> higher headline rate, utilization risk, price risk. Spot GPU prices FALL as supply arrives and
each new chip generation launches (H100 on-demand went from $4+ to ~$2 in about two years — teaching approximation).</li>
<li>Blended margin: contracted base + on-demand kicker. Ask every neocloud: what % of fleet is contracted, to whom, at what remaining term?</li>
</ul>
<h3>The depreciation-life war</h3>
<ul>
<li>Company chooses 5–6 years straight-line; skeptics argue frontier <i>training</i> demand only pays premium rates for

scrutinize.</li>
<li>The honest lens: <b>EBITDA − replacement capex</b>, or IRR per cluster: capex out, contracted cash in, then a

</ul>
<h3>Power & cost stack per GPU</h3>

ACADEMY.gens.dcPUE = function () {
  const it = rpick([24, 36, 48, 64, 96, 120, 200]); const pue = rpick([1.15, 1.2, 1.25, 1.3, 1.4, 1.5]);
  return { t: "num", q: `A campus has ${it} MW of critical IT load and runs at a PUE of ${fmt(pue, 2)}. <b>Total facility power draw</b>?`,
    ans: it * pue, dp: 1, tol: 0.2, unit: "MW",
    sol: `${it} × ${fmt(pue, 2)} = <b>${fmt(it * pue, 1)} MW</b> — the number the utility must deliver (and the interconnection request should cover).` };
};
ACADEMY.gens.dcColoRev = function () {
  const mw = rpick([12, 24, 36, 48, 72, 96]); const rate = rstep(95, 175, 5); const occ = rpick([85, 90, 95, 100]);
  const rev = mw * 1000 * rate * 12 * occ / 100 / 1e6;
  return { t: "num", q: `${mw} MW of IT capacity leased at $${fmt(rate, 0)}/kW-month, ${occ}% occupancy. <b>Annual rental revenue</b>?`,
    ans: rev, dp: 1, tol: rev * 0.012, unit: "$M",
    sol: `${mw},000 kW × $${fmt(rate, 0)} × 12 × ${occ}% = <b>$${fmt(rev, 1)}M</b>.` };
};
ACADEMY.gens.dcYoC = function () {
  const mw = rpick([24, 36, 48, 60]); const cpm = rstep(9, 13, 0.5);
  const noiPerMW = rstep(1.0, 1.5, 0.05);
  const noi = Math.round(noiPerMW * mw * 10) / 10;
  const cost = mw * cpm;
  const yoc = noi / cost * 100;
  return { t: "num", q: `A ${mw} MW data center development costs $${fmt(cpm, 1)}M per MW all-in and stabilizes at total NOI of $${fmt(noi, 1)}M/yr. <b>Yield on cost</b> (%)?`,
    ans: yoc, dp: 2, tol: 0.12, unit: "%",
    sol: `Cost = ${mw} × ${fmt(cpm, 1)} = $${fmt(cost, 0)}M → YoC = ${fmt(noi, 1)} ÷ ${fmt(cost, 0)} = <b>${fmt(yoc, 2)}%</b>. Compare to exit cap rates (~6–7%): the spread is the developer's profit.` };
};
ACADEMY.gens.dcCapVal = function () {
  const noi = rstep(30, 120, 5); const cap = rpick([5.75, 6, 6.25, 6.5, 6.75, 7, 7.25]);
  const v = noi / (cap / 100);
  return { t: "num", q: `A stabilized, fully-leased data center produces $${fmt(noi, 0)}M of NOI. At a ${fmt(cap, 2)}% cap rate, <b>what is it worth</b>?`,
    ans: v, dp: 0, tol: v * 0.012, unit: "$M",
    sol: `Value = NOI ÷ cap = ${fmt(noi, 0)} ÷ ${fmt(cap, 2)}% = <b>$${fmt(v, 0)}M</b>.` };
};
ACADEMY.gens.dcPowerCost = function () {
  const fmw = rpick([30, 60, 90, 125, 160]); const p = rstep(45, 90, 5);
  const cost = fmw * 8760 * p / 1e6;
  return { t: "num", q: `A campus draws ${fmw} MW of facility load around the clock at an all-in power price of $${fmt(p, 0)}/MWh. <b>Annual electricity bill</b>?`,
    ans: cost, dp: 1, tol: cost * 0.012, unit: "$M",
    sol: `${fmw} × 8,760 × $${fmt(p, 0)} = <b>$${fmt(cost, 1)}M</b>. (Usually a tenant pass-through in NNN colo — but the number that matters to utilities and regulators.)` };
};
ACADEMY.gens.gpuRev = function () {
  const rate = rstep(1.4, 3.8, 0.05); const util = ri(40, 95);
  const rev = rate * 8760 * util / 100;
  return { t: "num", q: `A GPU rents at $${fmt(rate, 2)}/GPU-hour with ${util}% utilization. <b>Annual revenue per GPU</b>?`,
    ans: rev, dp: 0, tol: rev * 0.012, unit: "$/GPU-yr",
    sol: `${fmt(rate, 2)} × 8,760 × ${util}% = <b>$${fmt(rev, 0)}</b>.` };
};
ACADEMY.gens.gpuFleetEBITDA = function () {
  const n = rpick([4, 8, 10, 16, 24]); // thousands
  const rate = rstep(1.7, 2.6, 0.05); const opexGPU = rstep(2.5, 4.5, 0.25); // $k/GPU-yr
  const rev = n * 1000 * rate * 8760 / 1e6;
  const e = rev - n * 1000 * opexGPU * 1000 / 1e6;
  return { t: "num", q: `A neocloud runs ${fmt(n, 0)},000 GPUs fully contracted (take-or-pay) at $${fmt(rate, 2)}/GPU-hr. Cash opex (colo, power, staff, S&M) is $${fmt(opexGPU * 1000, 0)}/GPU-yr. <b>Annual EBITDA</b>?`,
    ans: e, dp: 0, tol: e * 0.015, unit: "$M",
    sol: `Revenue = ${fmt(n, 0)}k × ${fmt(rate, 2)} × 8,760 = $${fmt(rev, 0)}M; opex = ${fmt(n, 0)}k × ${fmt(opexGPU, 2)}k = $${fmt(n * opexGPU, 1)}M → EBITDA <b>$${fmt(e, 0)}M</b>.` };
};
ACADEMY.gens.gpuPayback = function () {
  const capex = rstep(32, 48, 1); // $k
  const net = rstep(7, 14, 0.5);  // $k net cash per GPU-yr
  const pb = capex / net;
  return { t: "num", q: `All-in capex is $${fmt(capex, 0)}k per GPU; each GPU nets $${fmt(net, 1)}k/yr after cash opex. <b>Simple payback</b> in years?`,
    ans: pb, dp: 2, tol: 0.06, unit: "years",
    sol: `${fmt(capex, 0)} ÷ ${fmt(net, 1)} = <b>${fmt(pb, 2)} yrs</b>. Now compare to the contract term and to the chip's competitive life — if payback > both, the equity is a hope certificate.` };
};
ACADEMY.gens.gpuBreakeven = function () {
  const capex = rstep(34, 46, 2); const yrs = rpick([3, 4]); const opex = rstep(2.5, 4, 0.25); const util = rpick([70, 80, 90, 100]);
  const need = (capex / yrs + opex) * 1000 / (8760 * util / 100);
  return { t: "num", q: `Capex $${fmt(capex, 0)}k/GPU, cash opex $${fmt(opex, 2)}k/GPU-yr, target payback ${yrs} years at ${util}% utilization. <b>Required rental rate</b> ($/GPU-hr)?`,
    ans: need, dp: 2, tol: 0.04, unit: "$/GPU-hr",
    sol: `Need (${fmt(capex, 0)}/${yrs} + ${fmt(opex, 2)}) = $${fmt(capex / yrs + opex, 2)}k/yr ÷ (8,760 × ${util}%) = <b>$${fmt(need, 2)}/hr</b>. Compare that to the market rate — that's your margin of safety (or absence of one).` };
};
ACADEMY.gens.gpuPowerCost = function () {
  const kw = rpick([1.1, 1.2, 1.3, 1.4, 1.5]); const price = rstep(0.04, 0.09, 0.005);
  const cost = kw * 8760 * price;
  return { t: "num", q: `Each GPU consumes ${fmt(kw, 1)} kW all-in (server share + cooling overhead), running 24/7 at $${fmt(price, 3)}/kWh. <b>Annual power cost per GPU</b>?`,
    ans: cost, dp: 0, tol: cost * 0.015, unit: "$/GPU-yr",
    sol: `${fmt(kw, 1)} × 8,760 × ${fmt(price, 3)} = <b>$${fmt(cost, 0)}</b>. Real money at fleet scale — but availability of power, not its price, is the binding constraint.` };
};

<p>Most energy and data center assets aren't financed like companies — they're financed like <b>projects</b>: a
special-purpose vehicle (SPV), a bundle of contracts, and debt that can only look to the project's own cash flows.
This is the native language of PE/infra/renewables funds — and increasingly of neocloud financings.</p>
<h3>The structure</h3>
<ul>
<li><b>SPV / ProjectCo</b> owns the asset. Sponsors put in equity; lenders lend <b>non-recourse</b> — if the project
fails, they get the project, not the sponsor's balance sheet.</li>
<li>The bankability stack: offtake (PPA/lease/take-or-pay), EPC contract (who builds, fixed price?), O&amp;M
agreement, interconnection agreement, site control, permits. Debt is priced against the WEAKEST of these.</li>
<li><b>CFADS</b> — cash flow available for debt service = revenue − opex − taxes (before debt). The project's paycheck.</li>
</ul>
<h3>DSCR — the covenant that runs the show</h3>
<div class="formula">DSCR = CFADS ÷ debt service (principal + interest)<br>
1.0× = breakeven · contracted solar sized at ~1.25–1.35× · merchant/partially contracted 1.7–2.5×+<br>
Max debt service = CFADS ÷ target DSCR → debt = PV of that payment stream (annuity at the loan rate/tenor)</div>
<div class="workedex"><div class="wx-title">Worked example</div>
CFADS $19.2M, target DSCR 1.30× → max debt service $14.8M/yr. At 6.75% for 15 years the annuity factor is
(1 − 1.0675⁻¹⁵)/0.0675 = 9.25 → supportable debt ≈ <b>$137M</b>. Debt capacity is a PV of contracted cash —
which is why longer PPAs = more (and cheaper) leverage.</div>
<h3>P50 / P90 / P99 — energy's downside grammar</h3>
<ul>
<li>P50 = median annual production; <b>P90</b> = the level exceeded 90% of years (a bad-but-plausible year); P99 = worst-case-ish.</li>
<li>Lenders size on conservative cases: e.g., 1.30× on P50 <i>and</i> 1.20× on P90 — whichever binds. Equity earns
the difference between P50 reality and P90 sizing.</li>
</ul>
<h3>Protective plumbing</h3>
<ul>
<li><b>Sculpting:</b> shape principal payments so DSCR stays constant as CFADS varies (contract step-downs, degradation).</li>
<li><b>DSRA:</b> a reserve holding ~6 months of debt service. <b>Cash sweeps:</b> in merchant deals, excess cash
force-pays debt. <b>Distribution tests:</b> equity gets paid only if DSCR &gt; threshold and reserves are full.</li>
<li><b>Merchant tail:</b> cash flows after the contract ends. Lenders credit it lightly; equity's upside lives there.</li>
</ul>`;

ACADEMY.gens.pfDSCR = function () {
  const ds = ri(20, 90); const dscr = rstep(1.05, 2.2, 0.05);
  const cfads = Math.round(ds * dscr * 10) / 10;
  return { t: "num", q: `A project generates CFADS of $${fmt(cfads, 1)}M against annual debt service of $${fmt(ds, 0)}M. <b>DSCR</b>? (×)`,
    ans: cfads / ds, dp: 2, tol: 0.03, unit: "×",
    sol: `${fmt(cfads, 1)} ÷ ${fmt(ds, 0)} = <b>${fmt(cfads / ds, 2)}×</b>. Below ~1.1× distributions usually lock; at 1.0× the equity check engine stalls.` };
};
ACADEMY.gens.pfMaxDebt = function () {
  const cfads = ri(15, 60); const dscr = rpick([1.25, 1.3, 1.35, 1.4]);
  const r = rpick([5.5, 6, 6.5, 7]); const n = rpick([15, 18, 20]);
  const ds = cfads / dscr;
  const af = (1 - Math.pow(1 + r / 100, -n)) / (r / 100);
  const debt = ds * af;
  return { t: "num", q: `Size the debt: CFADS $${fmt(cfads, 0)}M/yr (flat), target DSCR ${fmt(dscr, 2)}×, fully-amortizing loan at ${r}% over ${n} years. <b>Maximum debt</b>? (Annuity factor = (1−(1+r)⁻ⁿ)/r)`,
    ans: debt, dp: 0, tol: debt * 0.015, unit: "$M",
    sol: `Max DS = ${fmt(cfads, 0)}/${fmt(dscr, 2)} = ${fmt(ds, 2)}; AF(${r}%, ${n}y) = ${fmt(af, 3)} → debt = ${fmt(ds, 2)} × ${fmt(af, 3)} = <b>$${fmt(debt, 0)}M</b>.` };
};
ACADEMY.gens.pfMOIC = function () {
  const eq = ri(40, 300); const m = rstep(1.4, 3.2, 0.05);
  const dist = Math.round(eq * m);
  return { t: "num", q: `A fund invests $${fmt(eq, 0)}M of equity and ultimately receives $${fmt(dist, 0)}M back. <b>MOIC</b>? (×)`,
    ans: dist / eq, dp: 2, tol: 0.03, unit: "×",
    sol: `${fmt(dist, 0)} ÷ ${fmt(eq, 0)} = <b>${fmt(dist / eq, 2)}×</b>.` };
};
ACADEMY.gens.pfIRR = function () {
  const m = rstep(1.5, 3, 0.1); const n = ri(3, 7);
  const irr = (Math.pow(m, 1 / n) - 1) * 100;
  return { t: "num", q: `A single-exit deal returns ${fmt(m, 1)}× the equity after ${n} years (no interim cash). <b>IRR</b>? (%)`,
    ans: irr, dp: 1, tol: 0.25, unit: "%",
    sol: `IRR = ${fmt(m, 1)}^(1/${n}) − 1 = <b>${fmt(irr, 1)}%</b>. Speed matters: the same multiple over ${n + 2} years is only ${fmt((Math.pow(m, 1 / (n + 2)) - 1) * 100, 1)}%.` };
};
ACADEMY.gens.pfCoC = function () {
  const eq = ri(30, 200); const y = rstep(6, 15, 0.5);
  const cash = Math.round(eq * y) / 100;
  return { t: "num", q: `Sponsor equity of $${fmt(eq, 0)}M receives annual distributions of $${fmt(cash, 2)}M. <b>Cash-on-cash yield</b>? (%)`,
    ans: cash / eq * 100, dp: 1, tol: 0.2, unit: "%",
    sol: `${fmt(cash, 2)} ÷ ${fmt(eq, 0)} = <b>${fmt(cash / eq * 100, 1)}%</b>.` };
};
ACADEMY.gens.pfCarry = function () {
  const inv = rpick([50, 100, 150, 200]); const m = rstep(1.8, 2.8, 0.1);
  const profit = Math.round(inv * (m - 1));
  return { t: "num", q: `A deal returns ${fmt(m, 1)}× on $${fmt(inv, 0)}M invested. Assuming the pref is cleared and the GP catch-up completes, <b>GP carried interest at 20%</b>?`,
    ans: profit * 0.2, dp: 1, tol: Math.max(profit * 0.2 * 0.02, 0.2), unit: "$M",
    sol: `Profit = ${fmt(inv, 0)} × (${fmt(m, 1)} − 1) = $${fmt(profit, 0)}M → carry = 20% × ${fmt(profit, 0)} = <b>$${fmt(profit * 0.2, 1)}M</b>. (Full catch-up makes carry ≈ 20% of TOTAL profit.)` };
};
ACADEMY.gens.pfLBO = function () {
  const e0 = rpick([80, 100, 120, 150]); const mult = rpick([8, 9, 10, 11]);
  const debtPct = rpick([50, 55, 60]); const g = rpick([5, 6, 7, 8]); const n = 5;
  const paydown = rpick([30, 40, 50]);
  const ev0 = e0 * mult, d0 = ev0 * debtPct / 100, eq0 = ev0 - d0;
  const e5 = e0 * Math.pow(1 + g / 100, n);
  const ev5 = e5 * mult, d5 = d0 * (1 - paydown / 100), eq5 = ev5 - d5;
  const moic = eq5 / eq0;
  return { t: "num", q: `LBO-lite: buy at ${mult}× on $${fmt(e0, 0)}M EBITDA with ${debtPct}% debt. EBITDA grows ${g}%/yr for ${n} years; exit at the same ${mult}×; ${paydown}% of the debt is repaid from cash flow. <b>Equity MOIC</b>? (×)`,
    ans: moic, dp: 2, tol: 0.05, unit: "×",
    sol: `Entry: EV ${fmt(ev0, 0)}, debt ${fmt(d0, 0)}, equity ${fmt(eq0, 0)}. Exit: EBITDA ${fmt(e5, 1)} × ${mult} = ${fmt(ev5, 0)}; debt ${fmt(d5, 0)} → equity ${fmt(eq5, 0)}. MOIC = <b>${fmt(moic, 2)}×</b> (≈ ${fmt((Math.pow(moic, 1 / n) - 1) * 100, 1)}% IRR).` };
};
ACADEMY.gens.pfRateBase = function () {
  const rb = rpick([4000, 6000, 8000, 10000]); const eqr = rpick([50, 52, 55]);
  const roe = rpick([9.2, 9.5, 9.6, 10]); const sh = rpick([120, 150, 180, 220]);
  const ni = rb * eqr / 100 * roe / 100;
  return { t: "num", q: `A regulated utility has a $${fmt(rb, 0)}M rate base, a ${eqr}% authorized equity layer, and a ${fmt(roe, 1)}% allowed ROE. With ${sh}M shares, <b>EPS if it earns its full allowed return</b>?`,
    ans: ni / sh, dp: 2, tol: 0.03, unit: "$/share",
    sol: `NI = ${fmt(rb, 0)} × ${eqr}% × ${fmt(roe, 1)}% = $${fmt(ni, 1)}M ÷ ${sh}M = <b>$${fmt(ni / sh, 2)}</b>. Utility EPS ≈ rate base × equity ratio × ROE — the whole sector in one line.` };
};
